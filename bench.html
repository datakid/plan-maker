<script>
window.benchRun = function(){
  const out = [];
  const seed = JSON.stringify(App.data);
  const spans = [['week', 6], ['month', 27], ['quarter', 94]];
  for(const [name, add] of spans){
    App.data = normalizeData(JSON.parse(seed));
    const start = '2026-10-04';
    const end = isoOf(ordOf(start)+add);
    S().period = Object.assign({}, S().period, {goal:'range', preset:'custom', start, end});
    const t0 = performance.now();
    const r = generatePlan({seed:20260101, timeScale:(window.BENCH_TS || 1)});
    const ms = Math.round(performance.now()-t0);
    const g = r.plan && r.plan.gen && r.plan.gen.search || r.search || {};
    let key = '';
    if(r.plan){ const c = JSON.parse(JSON.stringify(r.plan)); const strip = o=>{ if(Array.isArray(o)) return o.forEach(strip); if(o && typeof o==='object'){ for(const k of Object.keys(o)){ if(['ms','lnsMs','createdAt','generatedAt','at','id','vid'].includes(k)) delete o[k]; else strip(o[k]); } } }; strip(c); key = JSON.stringify(c); }
    let h = 0; for(let i=0; i<key.length; i++) h = (Math.imul(h, 31)+key.charCodeAt(i))|0;
    out.push({name, ms, hash:h, visits:r.plan ? r.plan.visits.length : 0, status:r.status, hard:g.score ? g.score.hard : null, soft:g.score ? g.score.soft : null, iters:g.iters==null ? null : g.iters, polishIters:g.polish ? g.polish.iters : null});
  }
  return out;
};
</script>
