})();

function parseDateList(text){

      const b = parseDateFlexible(rangeParts[1].trim());

    const isException = exceptionSet.has(iso);

function buildCrcTable(){
  const table = new Uint32Array(256);

    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);

  }
  return table;
}

}

function upgradeStore(s){
  s.facilities = s.facilities.map(f=>Object.assign({}, f, {crit:snapLevel(f.crit==null ? 50 : f.crit)}));
  s.people = s.people.map(p=>Object.assign({}, p, {weight:1, rank:snapLevel(p.rank==null ? 50 : p.rank)}));
  s.settings.rankSplitNotice = true;
  const legacyDays = s.settings.weekdays2 && Object.keys(s.settings.weekdays2).length ? s.settings.weekdays2
    : (s.settings.weekdayProfiles && Object.keys(s.settings.weekdayProfiles).length ? migrateWeekdayProfiles(s.settings.weekdayProfiles) : null);
  if(legacyDays){
    const split = splitWeekdays2(legacyDays);
    s.settings.dayDefaults = Object.assign(defaultDayConfig(), split.defaults);
    s.settings.dayOverrides = split.overrides;
  }
  delete s.settings.weekdays2;
  if(s.settings.visitBudget && s.settings.visitBudget.kind==='all'){
    s.settings.visitBudget = Object.assign({}, s.settings.visitBudget, {kind:'auto'});
    s.settings.goal = Object.assign(defaultGoal(), {mode:'coverage'});
  }
}
function normalizeStore(raw){
  const s = emptyStore();

  if(Array.isArray(raw.locations)) s.locations = raw.locations;
  if(Array.isArray(raw.facilities)) s.facilities = raw.facilities;
  if(Array.isArray(raw.people)) s.people = raw.people;
  if(raw.history) s.history = Object.assign(emptyStore().history, raw.history, {
    initialCounts: Object.assign({fin:{},clin:{}}, raw.history.initialCounts||{})
  });
  s.aliases = {people:(raw.aliases&&raw.aliases.people)||{}, facilities:(raw.aliases&&raw.aliases.facilities)||{}};
  if(Array.isArray(raw.unresolvedNames)) s.unresolvedNames = raw.unresolvedNames;
  if(raw.version<STORE_VERSION) upgradeStore(s);
  return s;
}

    const folded = {};
    for(let d=0; d<7; d++) folded[d] = Object.assign({}, state.dayDefaults, (state.dayOverrides||{})[d]||{});

  }

  for(const raw of flat){

function hydrateLocations(){
  let locs = Array.isArray(store.locations) ? store.locations.slice() : [];
  if(!locs.length){
    locs = Object.keys(LOCATION_DISTANCE_KM).map(name=>({id:locationIdFor(name), name, km:LOCATION_DISTANCE_KM[name]}));
    locs.push({id:locationIdFor('النفرة'), name:'النفرة', km:8});
  }
  const byId = new Map(locs.map(l=>[l.id,l]));
  const byName = new Map(locs.map(l=>[norm(l.name),l]));
  for(const f of state.registry){
    if(f.locationId && byId.has(f.locationId)){ delete f.distanceKm; continue; }
    if(!f.location){ f.locationId = null; delete f.distanceKm; continue; }
    let loc = byName.get(norm(f.location));
    if(!loc){
      loc = {id: locationIdFor(f.location), name: f.location, km: f.distanceKm!=null ? f.distanceKm : 0};
      locs.push(loc); byId.set(loc.id, loc); byName.set(norm(loc.name), loc);
    }
    f.locationId = loc.id;
    delete f.distanceKm;
  }
  state.locations = locs;
  store.locations = locs;
}

function normalizeGoal(g){

function arraysDiffer(a,b){

function computePeopleDiff(records, allPeople, registry){

  for(const rec of records){

    const weight = rec.weightRaw!==undefined && rec.weightRaw!=='' ? parseFloat(rec.weightRaw) : 1;
    if(isNaN(weight)){ unparseable.push({rowIndex:rec.rowIndex, reason:'weight', raw:rec.weightRaw}); continue; }
    const pool = parsePoolRaw(rec.poolRaw);
    const gender = parseGenderRaw(rec.genderRaw);
    const active = parseActiveRaw(rec.activeRaw);
    const fixedCount = parseFixedCountRaw(rec.fixedCountRaw);
    const unavailable = parseDateListRaw(rec.unavailableRaw);
    const blockedFacilities = parseFacilityListRaw(rec.blockedRaw, registry);
    const key = normPerson(name);
    seenNames.add(key);
    const existing = byName.get(key);
    if(!existing){
      added.push({name, pool, gender, active, weight, fixedCount, unavailable, blockedFacilities});
    } else {
      const fields=[];
      if(existing.pool!==pool) fields.push({field:'pool', from:existing.pool, to:pool});
      if(existing.gender!==gender) fields.push({field:'gender', from:existing.gender, to:gender});
      if(!!existing.active!==active) fields.push({field:'active', from:!!existing.active, to:active});
      if(existing.weight!==weight) fields.push({field:'weight', from:existing.weight, to:weight});
      if((existing.fixedCount==null?null:existing.fixedCount)!==fixedCount) fields.push({field:'fixedCount', from:existing.fixedCount, to:fixedCount});
      if(arraysDiffer(existing.unavailable, unavailable)) fields.push({field:'unavailable', from:(existing.unavailable||[]).length, to:unavailable.length});
      if(arraysDiffer(existing.blockedFacilities, blockedFacilities)) fields.push({field:'blockedFacilities', from:(existing.blockedFacilities||[]).length, to:blockedFacilities.length});
      if(fields.length) changed.push({existing, name, pool, gender, active, weight, fixedCount, unavailable, blockedFacilities, fields});
    }
  }
  const missing = allPeople.filter(p=>!seenNames.has(normPerson(p.name)));
  return {added, changed, missing, unparseable, totalRows:records.length};
}
function applyPeopleDiff(diff, pools, missingActions){
  missingActions = missingActions || {};
  function poolArr(name){ return pools[name] || pools.fin; }
  for(const a of diff.added){
    poolArr(a.pool).push(freshPerson({
      id:'p_custom_'+uid('x'), name:a.name, gender:a.gender, active:a.active, weight:a.weight,
      fixedCount:a.fixedCount, unavailable:a.unavailable, blockedFacilities:a.blockedFacilities, pool:a.pool
    }));
  }
  for(const c of diff.changed){
    const p = c.existing;
    const oldPool = p.pool||'fin';
    Object.assign(p, {gender:c.gender, active:c.active, weight:c.weight, fixedCount:c.fixedCount, unavailable:c.unavailable, blockedFacilities:c.blockedFacilities, pool:c.pool});
    if(Array.isArray(c.fields) && c.fields.some(x=>x.field==='unavailable')) p.off = migrateToOff(c.unavailable, []);
    if(oldPool!==c.pool){
      const src = poolArr(oldPool);
      const idx = src.indexOf(p);
      if(idx>=0) src.splice(idx,1);
      poolArr(c.pool).push(p);
    }
  }
  for(const p of diff.missing){
    if(missingActions[p.id]==='retire' && p.pool!=='retired'){
      const src = poolArr(p.pool||'fin');
      const idx = src.indexOf(p);
      if(idx>=0) src.splice(idx,1);
      p.pool = 'retired';
      pools.retired.push(p);
    }
  }
}

function planToRows(plan, cycle, exportOpts){

  const headers = colKeys.map(k=>EXPORT_COL_HEADERS[k]);
  const nonEmpty = plan.rows.filter(r=>!r.empty);
  const placeholders = new Map();
  let phCounter = 0;
  for(const r of nonEmpty){
    if(!placeholders.has(r.facility.id)){ phCounter++; placeholders.set(r.facility.id, 'جهة '+toArabicIndicDigits(phCounter)); }
  }
  const facEx = (exportOpts.exceptions && exportOpts.exceptions.facilities) || {};
  const perEx = (exportOpts.exceptions && exportOpts.exceptions.people) || {};
  const rows = [];

      const px = perEx[p.id];
      if(px==='omit') omitRow = true;
      return px==='redact' ? '***' : p.name;

    if(exportOpts.mode==='noFacility') facilityName = placeholders.get(r.facility.id);

      typeLabel: r.kind==='basic' ? 'أساسي' : 'متعاقد', date: fmtISO(r.date), team: teamNames.join('-')

function gateOffenderIndex(key, plan){
  const rows = plan.rows, specs = plan.pools || defaultPools();
  const times = plan.times || 1;
  if(key==='open-seats') return rows.findIndex(r=>!r.empty && openSeatCount(r)>0);
  if(key==='team-size') return rows.findIndex(r=>!r.empty && rowTeam(r).length!==specs.reduce((sum, pl)=>sum+seatsFor(pl, r.kind, r.facility.category), 0));
  if(key==='window') return rows.findIndex(r=>!r.empty && r.facility.visitWeekdays && !r.facility.visitWeekdays.includes(r.date.getDay()));
  if(key==='dup-person') return rows.findIndex(r=>!r.empty && new Set(rowTeam(r).map(x=>x.id)).size!==rowTeam(r).length);
  if(key==='no-excluded') return rows.findIndex(r=>!r.empty && (r.facility.kind==='excluded' || r.facility.manualExcluded));
  if(key==='no-retired'){
    const retired = new Set((state.retiredPool||[]).map(x=>x.id));
    return rows.findIndex(r=>!r.empty && rowTeam(r).some(x=>retired.has(x.id)));
  }
  if(key==='dup-facility'){
    const seen = new Map();
    for(let i=0; i<rows.length; i++){
      const r = rows[i]; if(r.empty) continue;
      const c = (seen.get(r.facility.id)||0)+1; seen.set(r.facility.id, c);
      if(c>times) return i;
    }
    return -1;
  }
  if(key==='dup-person-day'){
    const seen = new Set();
    for(let i=0; i<rows.length; i++){
      const r = rows[i]; if(r.empty) continue;
      const d = fmtISO(r.date);
      for(const x of rowTeam(r)){
        const k = d+'|'+x.id;
        if(seen.has(k)) return i;
        seen.add(k);
      }
    }
  }
  return -1;
}

function replacementCandidates(row, plan){
  const times = plan.times || 1, dow = row.date.getDay();
  const inPlan = new Map();
  for(const r of plan.rows) if(!r.empty) inPlan.set(r.facility.id, (inPlan.get(r.facility.id)||0)+1);
  const w2 = resolvedWeekdays2(), wcfg = w2 && w2[dow];
  const blocked = makeBlockedChecker(), team = rowTeam(row), specs = plan.pools || defaultPools();
  const ok = f=>{
    if(f.id===row.facility.id || f.kind!==row.kind || f.manualExcluded) return false;
    if((inPlan.get(f.id)||0) >= times) return false;
    if(f.visitWeekdays && !f.visitWeekdays.includes(dow)) return false;
    if(wcfg && wcfg.restrictTo && !wcfg.restrictTo.includes(f.category)) return false;
    if(team.some(x=>blocked(x, f))) return false;
    for(const pl of specs){
      const have = teamOf(row, pl.id).length + ((row.openSeats && row.openSeats[pl.id])||0);
      if(seatsFor(pl, row.kind, f.category)!==have) return false;
    }
    return true;
  };
  const NEVER = plan.NEVER || computeNever(state.registry);
  return state.registry.filter(ok)
    .map(f=>({f, s:displayScore(f, plan.planStart, NEVER, plan.dctx, plan.globalDistanceBias)}))
    .sort((a, b)=>(b.s===a.s ? 0 : (b.s>a.s ? 1 : -1)))
    .slice(0, 12).map(x=>x.f);
}

function removeFacilityFromRegistry(facility){
  const idx = state.registry.indexOf(facility);
  if(idx>=0) state.registry.splice(idx,1);
  state.facilitySelected.delete(facility.id);
  let touchedPeople = false;
  for(const pool of Object.values(peopleBuckets())){
    for(const p of pool){
      if(!Array.isArray(p.blockedFacilities) || !p.blockedFacilities.length) continue;
      const kept = p.blockedFacilities.filter(x=>x!==facility.id);
      if(kept.length!==p.blockedFacilities.length){ p.blockedFacilities = kept; touchedPeople = true; }
    }
  }
  saveRegistry();
  if(touchedPeople) savePeople();
}

let settingsRestore = null;
let restoreSuppressed = false;
function settingsPathOf(node){
  const root = document.getElementById('viewRoot');
  if(!node || !root || !root.contains(node)) return null;
  const path = [];
  let cur = node;
  while(cur && cur!==root){
    const parent = cur.parentNode;
    if(!parent) return null;
    path.push(Array.prototype.indexOf.call(parent.children, cur));
    cur = parent;
  }
  return path.reverse();
}
function settingsNodeAt(path){
  if(!path) return null;
  let cur = document.getElementById('viewRoot');
  if(!cur) return null;
  for(const i of path){
    if(!cur.children || !cur.children[i]) return null;
    cur = cur.children[i];
  }
  return cur;
}
function captureSettingsRestore(){
  if(restoreSuppressed){ settingsRestore = null; return; }
  const active = document.activeElement;
  settingsRestore = {
    y: window.scrollY,
    path: settingsPathOf(active && active!==document.body ? active : null)
  };
}
function applySettingsRestore(){
  const r = settingsRestore;
  settingsRestore = null;
  if(!r) return;
  if(r.y) window.scrollTo(0, r.y);
  const node = settingsNodeAt(r.path);
  if(!node || typeof node.focus!=='function') return;
  const tag = node.tagName;
  const focusable = tag==='BUTTON' || tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA' || tag==='A' || node.hasAttribute('tabindex');
  if(focusable && !node.disabled) node.focus({preventScroll:true});
}

  });
  const goodResult = validateBackupStore(goodStore);
  const cases = [
    ['duplicate facility id', s=>{ s.facilities.push(Object.assign({}, s.facilities[0])); }],
    ['duplicate person id', s=>{ s.people.push(Object.assign({}, s.people[0])); }],

    const clone = JSON.parse(JSON.stringify(goodStore));

    if(result.valid) failures.push(label);
  }
  if(!goodResult.valid) throw new Error(`a well-formed backup should validate cleanly, got errors: ${goodResult.errors.join('; ')}`);

    if(ids2.includes('x6')) throw new Error('a facility blocked for a team member must not be offered');
  } finally { state.registry = savedReg; restore(); }
  return 'kind, usage, exclusion, weekday window, blocking and seat shape are all respected';
});
check('plan action bar (U1): status and actions follow the plan state', ()=>{
  const restore = planGuard();
  const d1 = new Date(2026,8,7);
  const bar = ()=>{ const host = el('div'); renderPlanActionBar(host); return host.querySelector('.plan-actionbar'); };
  const btnTexts = b=>[...b.querySelectorAll('button')].map(x=>x.textContent);
  try{
    state.plan = {rows:[mkRow(mkFac('a'), d1, [{id:'pa'}])]};
    state.planMeta = {cycle:1, planId:'ab', gates:[{key:'count', pass:true}]};
    state.planApproved = false; state.planStale = false; approveSnapshot = null;
    let b = bar();
    if(!b.textContent.includes(t('actionbarReady')(1))) throw new Error('ready status missing');
    const approve = [...b.querySelectorAll('button')].find(x=>x.textContent===t('approvePlan'));
    if(!approve || approve.disabled) throw new Error('approve must be enabled when every check passes');
    state.planMeta.gates = [{key:'count', pass:false}, {key:'budget-met', pass:false}];
    b = bar();
    if(!b.textContent.includes(t('actionbarFailing')(1, 1))) throw new Error('failing status wrong: '+b.textContent);
    if(![...b.querySelectorAll('button')].find(x=>x.textContent===t('approvePlan')).disabled) throw new Error('approve must be disabled while a check fails');
    state.planStale = true;
    b = bar();
    if(btnTexts(b).join()!==t('regenerateAction')) throw new Error('stale plans offer only regenerate: '+btnTexts(b).join());
    state.planStale = false; state.planApproved = true;
    b = bar();
    if(btnTexts(b).join()!==t('exportTitle')) throw new Error('approved without snapshot offers only export: '+btnTexts(b).join());
    approveSnapshot = {planId:'ab'};
    b = bar();
    if(btnTexts(b).join()!==[t('undoApprove'), t('exportTitle')].join()) throw new Error('approved with snapshot offers undo and export: '+btnTexts(b).join());
    state.plan = {rows:[{empty:true}]}; state.planApproved = false; state.planMeta.gates = [{key:'count', pass:true}];
    if(![...bar().querySelectorAll('button')].find(x=>x.textContent===t('approvePlan')).disabled) throw new Error('an empty plan cannot be approved');
  } finally { restore(); }
  return 'ready, failing, stale, approved and empty states all render the right actions';
});
check('results list (U3/U4): row indexes, person highlight, dimming and the empty note', ()=>{
  const restore = planGuard(), savedFocus = state.resultsFocusPerson;
  try{
    const d1 = new Date(2026,8,7), d2 = new Date(2026,8,8);
    const pa = {id:'pa', name:'A'}, pb = {id:'pb', name:'B'};
    state.plan = {rows:[mkRow(mkFac('a'), d1, [pa]), {empty:true}, mkRow(mkFac('b', {category:''}), d2, [pb])]};
    state.planMeta = {cycle:1, planId:'r', gates:[]};
    state.resultsFocusPerson = 'pa';
    let host = el('div'); renderResultsSection(host);
    const rows = [...host.querySelectorAll('.result-row')];
    if(rows.length!==2 || rows[0].dataset.ri!=='0' || rows[1].dataset.ri!=='2') throw new Error('data-ri must be the index in plan.rows');
    if(rows[0].classList.contains('dim') || !rows[1].classList.contains('dim')) throw new Error('only rows without the focused person are dimmed');
    if(!host.querySelector('.rteam .pill.hl')) throw new Error('the focused person pill is not highlighted');
    if(!host.querySelector('.chip-row .chip.active')) throw new Error('the highlight chip is missing');
    if(rows[1].querySelector('.rcat:not(.rcat-empty)')) throw new Error('no category pill when the facility has no category');
    if(rows[1].children.length!==4) throw new Error('the grid cell for the category must remain');
    state.resultsFocusPerson = 'ghost';
    host = el('div'); renderResultsSection(host);
    if(state.resultsFocusPerson!==null) throw new Error('an unknown focused person must be cleared');
    state.plan = {rows:[{empty:true}]};
    host = el('div'); renderResultsSection(host);
    if(!host.textContent.includes(t('emptyPlanNote'))) throw new Error('empty plan note missing');
  } finally { state.resultsFocusPerson = savedFocus; restore(); }
  return 'highlight, dim, index and empty state all behave';
});
check('print surface (U7): direction, language, heading with cycle and range, repeating header row', ()=>{
  const restore = planGuard();
  const surface = document.getElementById('printSurface');
  try{
    state.plan = {rows:[mkRow(mkFac('a'), new Date(2026,8,7), [{id:'pa', name:'A'}]), mkRow(mkFac('b'), new Date(2026,8,9), [{id:'pb', name:'B'}])]};
    state.planMeta = {cycle:7, planId:'pr'};
    buildPrintSurface();
    const h1 = surface.querySelector('h1');
    if(!h1 || !h1.textContent.includes('7')) throw new Error('heading must carry the cycle number');
    if(!h1.textContent.includes(formatDateDisplay('2026-09-07')) || !h1.textContent.includes(formatDateDisplay('2026-09-09'))) throw new Error('heading must carry the date range: '+h1.textContent);
    if(!surface.querySelector('table thead th')) throw new Error('table header missing');
    if(surface.getAttribute('dir')!==(state.lang==='ar'?'rtl':'ltr') || surface.getAttribute('lang')!==state.lang) throw new Error('dir/lang not set');
    if(surface.querySelectorAll('tbody tr').length!==2) throw new Error('row count wrong');
  } finally { clear(surface); restore(); }
  return 'print output is self-describing and paginates with a header';
});
check('topbar and tab bar (U6): localized accessible names on every control', ()=>{
  const top = document.getElementById('topbarRoot'), tabs = document.getElementById('tabbarInner');
  const btns = [...top.querySelectorAll('button')];
  if(btns.length!==2 || btns.some(b=>!b.getAttribute('aria-label') || !b.title)) throw new Error('topbar buttons need label and title');
  if(btns[0].getAttribute('aria-label')!==t('themeToggleLabel') || btns[1].getAttribute('aria-label')!==t('langToggleLabel')) throw new Error('labels are not the localized ones');
  const tabBtns = [...tabs.querySelectorAll('button')];
  if(tabBtns.length!==TABS.length || tabBtns.some(b=>!b.getAttribute('aria-label') || !b.title)) throw new Error('tabs need a name even when the visible label is hidden');
  return `${btns.length} topbar controls and ${tabBtns.length} tabs are named`;
});
check('favicon and theme color (A1/A2): valid SVG with xmlns, a single icon link, a theme-color meta tracking the page background', ()=>{
  const doc = new DOMParser().parseFromString(FAVICON_SVG, 'image/svg+xml');
  if(doc.querySelector('parsererror')) throw new Error('the favicon is not valid standalone SVG');
  if(!/xmlns="http:\/\/www\.w3\.org\/2000\/svg"/.test(FAVICON_SVG)) throw new Error('xmlns missing');
  setupFavicon(); setupFavicon();
  const links = document.querySelectorAll('link[rel~="icon"]');
  if(links.length!==1) throw new Error('expected exactly one icon link, got '+links.length);
  if(decodeURIComponent(links[0].href.split(',').slice(1).join(','))!==FAVICON_SVG) throw new Error('icon link does not carry the favicon');
  syncThemeColor();
  const meta = document.querySelector('meta[name="theme-color"]');
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-page').trim();
  if(!meta || meta.content!==bg) throw new Error('theme-color does not match --bg-page');
  return 'icon renders standalone and the browser bar follows the theme';
});
check('toasts (S2): status role, at most three at once, longer life for action toasts', ()=>{
  const region = ensureToastRegion();
  const before = region.innerHTML;
  clear(region);
  for(let i=0;i<5;i++) showToast('m'+i);
  const n = region.children.length, first = region.firstChild.textContent;
  clear(region);
  if(region.getAttribute('role')!=='status') throw new Error('toast region needs role=status');
  if(n!==3 || first!=='m2') throw new Error(`expected the newest three, got ${n} starting at ${first}`);
  return 'toast region is announced politely and never stacks more than three';
});
await checkAsync('requestGenerate (P4): the busy button is restored when generation does not happen', async ()=>{
  const savedRange = state.range, savedStart = state.customStart, savedEnd = state.customEnd, savedGoal = state.goal;
  const btn = el('button', {type:'button'}, 'go'); document.body.appendChild(btn);
  try{
    state.goal = Object.assign({}, state.goal, {mode:'range'});
    state.range = 'custom'; state.customStart = null; state.customEnd = null;
    if(resolveDateRangeState()) throw new Error('setup: expected no valid range');
    requestGenerate(btn);
    if(!btn.disabled || btn.textContent!==t('generatingLabel')) throw new Error('the button should show the busy state immediately');
    await new Promise(res=>setTimeout(res, 120));
    if(btn.disabled || btn.textContent!=='go') throw new Error('the button stayed stuck in the busy state');
  } finally { btn.remove(); state.range = savedRange; state.customStart = savedStart; state.customEnd = savedEnd; state.goal = savedGoal; }
  return 'no stuck "Generating…" button';
});

  }
  check('runSelfTests isolation (P2 fix #15): the entire suite leaves real localStorage byte-for-byte unchanged', ()=>{
    const shimData = new Map();

return results;
}
(function init(){
  setupFavicon();
  syncThemeColor();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeColor);
  store = hydrateStore();
  applyStoreToRuntime();
  restorePersistedPlan();
  initShell();
  window.addEventListener('storage', e=>{
    if(e.key!==null && e.key!==STORE_KEY && e.key!==PLAN_KEY) return;
    if(externalStoreChange) return;
    externalStoreChange = true;
    document.body.appendChild(el('div', {id:'externalChangeBar', class:'stale-bar external-bar', role:'alert'}, [
      el('span', null, t('externalChangeMsg')),
      el('button', {type:'button', onclick:()=>location.reload()}, t('reloadAction'))
    ]));
  });
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter' || !(e.ctrlKey||e.metaKey) || e.repeat) return;
    if(state.tab!=='plan' || overlayStack.length || state.planApproved || !resolveDateRangeState()) return;
    e.preventDefault(); requestGenerate(null);
  });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushPendingPersist(); });
  window.addEventListener('pagehide', flushPendingPersist);
  window.addEventListener('beforeunload', (e)=>{
    flushPendingPersist();
    if(shouldWarnBeforeUnload()){ e.preventDefault(); e.returnValue=''; return ''; }
  });
  if(state.pendingCadenceIntroToast){
    state.pendingCadenceIntroToast = false;
    showToast(t('cadenceIntroToast'));
  }
  if(state.pendingRankSplitToast){
    state.pendingRankSplitToast = false;
    delete store.settings.rankSplitNotice;
    persistStore();
    showToast(t('rankSplitToast'));
  }
  if(corruptStoreRecoveryKey){
    showToast(t('corruptStoreRecoveredToast'));
  }
  if(state.pendingPlanDroppedToast){
    state.pendingPlanDroppedToast = false;
    showToast(t('planRestoreDroppedToast'));
  }
})();
</script>
