<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الخطة</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 32 32' fill='none' xmlns='http://www.w3.org/2000/svg' aria-hidden='true'><rect x='3.5' y='5.5' width='25' height='23' rx='7.5' stroke='%236A4A6E' stroke-width='2'/><path d='M10 3.5v4M22 3.5v4' stroke='%236A4A6E' stroke-width='2' stroke-linecap='round'/><path d='M10.5 13.5H18a3 3 0 0 1 0 6h-4a3 3 0 0 0 0 6h7.5' stroke='%236A4A6E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='10.5' cy='13.5' r='1.8' fill='%236A4A6E'/><circle cx='21.5' cy='25.5' r='1.8' fill='%236A4A6E'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet" onerror="this.remove()">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  --bg:#EEEAE4; --surface:#F7F4F0; --ink:#2A2530; --muted:#7A7280;
  --accent:#6E5674; --accent-soft:#E9E1EA; --contracted:#8C7440; --line:#E5DFD9;
  --on-accent:#FFFFFF;
  --r-card:22px; --r-input:16px; --r-chip:999px;
  --shadow:0 1px 1px rgb(42 37 48 / .04), 0 10px 30px -18px rgb(42 37 48 / .22);
  --motion:190ms ease-out;
}
:root[data-theme="dark"]{
  --bg:#17151A; --surface:#211E26; --ink:#EAE3E8; --muted:#9A909A;
  --accent:#C0A7C6; --accent-soft:#2C2431; --contracted:#CDB183; --line:#2C2830;
  --on-accent:#151317;
}
:root[data-theme="dark"] .card{ box-shadow:none; border:1px solid var(--line); }
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#17151A; --surface:#211E26; --ink:#EAE3E8; --muted:#9A909A;
    --accent:#C0A7C6; --accent-soft:#2C2431; --contracted:#CDB183; --line:#2C2830;
    --on-accent:#151317;
  }
  :root:not([data-theme]) .card{ box-shadow:none; border:1px solid var(--line); }
}
html{color-scheme:light dark}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-variant-numeric:tabular-nums; line-height:1.65;
  transition:background var(--motion), color var(--motion);
}
h1,h2,h3{font-family:inherit}
.topbar{
  max-width:940px; margin-inline:auto; padding-inline:20px; padding-block-start:26px; padding-block-end:6px;
  display:flex; align-items:center; justify-content:space-between;
}
.wordmark{display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600}
.wordmark svg{width:26px; height:26px; color:var(--accent)}
.topbar-controls{display:flex; gap:8px}
.icon-btn{
  background:var(--surface); border:0; border-radius:var(--r-chip);
  min-width:38px; height:38px; padding-inline:12px; display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink); font-family:inherit; font-size:13px;
  transition:background var(--motion);
}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.shell{
  max-width:940px; margin-inline:auto; padding-inline:20px; padding-block:24px;
  display:flex; flex-direction:column; gap:20px;
}
.card{
  background:var(--surface); border-radius:var(--r-card); box-shadow:var(--shadow);
  padding:26px 28px;
}
.card h2{margin-block:0 14px; font-size:14px; color:var(--muted); font-weight:700; letter-spacing:.03em}
.card h3{margin-block:16px 8px; font-size:13px; color:var(--muted); font-weight:600}
.card-summary{color:var(--muted); font-size:13px; margin-block:10px 0}
.segmented{display:inline-flex; background:var(--bg); border-radius:var(--r-chip); padding:4px; gap:2px}
.segmented button{
  border:0; background:transparent; padding:8px 16px; border-radius:var(--r-chip); cursor:pointer;
  color:var(--muted); font-size:14px; font-family:inherit; transition:background var(--motion), color var(--motion);
}
.segmented button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.custom-range{display:flex; gap:16px; margin-block-start:14px; flex-wrap:wrap}
.custom-range label{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-block-start:12px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--r-chip);
  background:var(--bg); border:0; cursor:pointer; font-size:13px; color:var(--ink);
  font-family:inherit; transition:background var(--motion), color var(--motion);
}
.chip:hover{background:var(--accent-soft)}
.chip.active{background:var(--accent); color:var(--on-accent)}
.chip:disabled{opacity:.4; cursor:not-allowed}
.person-chip.inactive{opacity:.45; text-decoration:line-through}
.person-chip.hidden-for-export{opacity:.5}
.chip.readonly{cursor:default}
.chip.readonly:hover{background:var(--bg)}
.inline-check{display:flex; align-items:center; gap:6px}
.people-table{width:100%; border-collapse:collapse; margin-block-start:12px; font-size:13px}
.people-table th{text-align:start; font-weight:600; color:var(--muted); font-size:12px; padding:6px 8px; border-block-end:1px solid var(--line)}
.people-table td{padding:6px 8px; border-block-end:1px solid var(--line); vertical-align:middle}
.people-table tr.inactive td{opacity:.5}
.people-table input[type=text]{width:100%; min-width:110px}
.people-table input[type=number]{width:64px}
.field-hint{display:block; color:var(--muted); font-size:11px; font-weight:400; margin-block-start:2px}
.people-table th .field-hint{font-size:10px; white-space:normal}
.holiday-details{margin-block-start:14px; font-size:13px; color:var(--muted)}
.holiday-details summary{cursor:pointer}
.holiday-details textarea{width:100%; margin-block-start:8px; resize:vertical}
input[type=text],input[type=number],input[type=date],select,textarea{
  font-family:inherit; background:var(--bg); border:1px solid var(--line); border-radius:var(--r-input);
  padding:9px 13px; color:var(--ink); font-size:14px;
}
input[type=range]{width:100%; accent-color:var(--accent); margin-block-start:8px}
.manual-pane label{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-block-end:4px}
.stepper-row{display:flex; gap:20px; margin-block-start:14px; flex-wrap:wrap}
.stepper-row label{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.stepper-row input{width:80px}
.dropzone{
  margin-block-start:14px; border:1.5px dashed var(--line); border-radius:var(--r-input);
  padding:32px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer;
  transition:background var(--motion);
}
.dropzone.disabled{opacity:.6; cursor:default}
.paste-wrap{margin-block-start:12px; display:flex; flex-direction:column; gap:8px}
.paste-wrap textarea{width:100%; resize:vertical}
.remap-form{margin-block-start:14px; display:flex; flex-direction:column; gap:10px}
.remap-form label{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted)}
.error-text{color:var(--contracted)}
.resolve-list{display:flex; flex-direction:column; gap:8px; margin-block-start:8px}
.resolve-row{display:flex; align-items:center; gap:10px; font-size:13px; flex-wrap:wrap}
.thirds-table{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-block-start:6px}
.thirds-cell{background:var(--bg); border-radius:var(--r-input); padding:8px 14px}
.deviation-list{display:flex; flex-direction:column; gap:2px; margin-block-start:6px}
.deviation-list p{margin:0; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; max-width:320px}
.export-actions{display:flex; gap:8px; flex-wrap:wrap; margin-block-start:16px; align-items:center}
.export-actions button:disabled{opacity:.4; cursor:not-allowed}
.copy-feedback{font-size:12px; color:var(--accent)}
.visibility-panel{margin-block-start:14px; padding-block-start:14px; border-block-start:1px solid var(--line)}
.visibility-panel .chip-row{margin-block-start:8px}
.visibility-panel .chip.hidden-item{opacity:.4; text-decoration:line-through}
.primary-btn{
  align-self:center; background:var(--accent); color:var(--on-accent); border:0; border-radius:var(--r-chip);
  padding:14px 40px; font-size:15px; font-weight:600; cursor:pointer; box-shadow:var(--shadow);
  font-family:inherit; transition:transform var(--motion);
}
.primary-btn:hover{transform:translateY(-1px)}
.primary-btn:active{transform:translateY(0)}
.month-section h3{font-size:13px; color:var(--muted); margin-block:18px 6px; text-transform:uppercase; letter-spacing:.04em}
.day-row{
  display:flex; align-items:center; gap:12px; padding-block:9px; padding-inline-start:14px;
  border-inline-start:3px solid var(--accent); margin-block-end:2px; flex-wrap:wrap;
}
.day-row.contracted{border-inline-start-color:var(--contracted)}
.day-row.empty{border-inline-start-color:var(--line); color:var(--muted); font-size:13px}
.day-row .date{width:88px; flex-shrink:0; color:var(--muted); font-size:13px}
.day-row .facility{font-size:14px; min-width:140px}
.facility-toggle{background:transparent; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:start}
.facility-toggle:hover{color:var(--accent)}
.why-detail{flex-basis:100%; font-size:12px; color:var(--muted); padding-inline-start:14px; margin-block-start:2px}
.print-header{display:none}
.day-row .cat-chip{font-size:11px; padding:3px 10px; border-radius:var(--r-chip); background:var(--accent-soft); color:var(--accent)}
.day-row.contracted .cat-chip{background:color-mix(in srgb, var(--contracted) 22%, transparent); color:var(--contracted)}
.day-row .team-chips{position:relative; display:flex; gap:6px; flex-wrap:wrap; align-items:flex-start}
.mini-chip{
  font-size:11px; padding:3px 9px; border-radius:var(--r-chip); background:var(--bg); border:0; color:var(--muted);
  font-family:inherit; cursor:pointer; transition:background var(--motion), color var(--motion);
}
.mini-chip:hover{background:var(--accent-soft); color:var(--ink)}
.mini-chip.open{background:var(--accent); color:var(--on-accent)}
.swap-menu{
  display:flex; flex-direction:column; gap:4px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-input); padding:8px; box-shadow:var(--shadow); width:100%; margin-block-start:4px;
}
.swap-menu button{text-align:start}
.review-panel .gate{display:flex; gap:8px; align-items:baseline; padding-block:5px; font-size:13px}
.review-panel .gate.pass{color:var(--ink)}
.review-panel .gate.pass::before{content:"✓"; color:var(--accent); font-weight:700}
.review-panel .gate.fail::before{content:"✗"; color:var(--contracted); font-weight:700}
.review-panel .gate.pending::before{content:"…"; color:var(--muted)}
.drop-list{margin:6px 0 0; padding-inline-start:20px; font-size:12px; color:var(--muted)}
.totals-group{margin-block-end:14px}
.totals-group p{margin:2px 0; font-size:13px; display:flex; justify-content:space-between; max-width:320px}
footer{max-width:940px; margin-inline:auto; padding:20px; color:var(--muted); font-size:12px; text-align:center}
#selftestView{max-width:940px; margin-inline:auto; padding:32px 20px}
#selftestView h1{font-size:20px; margin-block-end:16px}
#settingsView{max-width:940px; margin-inline:auto; padding:32px 20px; display:flex; flex-direction:column; gap:6px}
#settingsView h1{font-size:20px; margin-block-end:10px}
#settingsView h2{font-size:14px; color:var(--muted); margin-block:20px 8px; font-weight:700}
#settingsView label{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); margin-block-end:6px}
#settingsView textarea{width:100%; margin-block-start:6px}
.review-flag{color:var(--contracted); font-size:11px; font-weight:600}
.subview-bar{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px; background:var(--bg); padding-block:10px 4px}
#facilitiesView{max-width:940px; margin-inline:auto; padding:32px 20px; display:flex; flex-direction:column; gap:10px}
#facilitiesView h1{font-size:20px; margin-block-end:6px}
#facilitiesView h2{font-size:14px; color:var(--muted); margin-block:16px 8px; font-weight:700}
#facilitiesView h3{font-size:13px; color:var(--muted); margin-block:10px 4px; font-weight:600}
#facilitiesView>input[type=text]{width:100%}
.facility-filter-row{display:flex; gap:10px; flex-wrap:wrap}
.facility-list{max-height:520px; overflow-y:auto; display:flex; flex-direction:column; gap:2px}
.facility-row{padding-block:10px; border-block-end:1px solid var(--line); font-size:13px}
.facility-row-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.facility-row-top .sf-name{min-width:180px; font-weight:600}
.facility-row-top .sf-cat{color:var(--muted)}
.facility-row-top .sf-loc{color:var(--muted); font-size:12px}
.facility-row-top .sf-kind{font-size:11px; padding:2px 8px; border-radius:var(--r-chip); background:var(--accent-soft); color:var(--accent)}
.facility-row-mid{display:flex; gap:16px; color:var(--muted); font-size:12px; margin-block-start:4px}
.facility-row-controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-block-start:8px}
.facility-row-controls input[type=number]{width:64px}
.weight-presets{display:flex; gap:4px}
.weight-presets .chip{padding:4px 10px; font-size:12px}
.facility-row-detail{margin-block-start:8px; padding:10px 14px; background:var(--bg); border-radius:var(--r-input); font-size:12px}
.facility-row-detail p{margin:2px 0}
.bulk-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--accent-soft); border-radius:var(--r-input)}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
@media print{
  .topbar, footer, #step1, #step2, #step3, .primary-btn, #review, #totals,
  .export-actions, .visibility-panel{display:none !important}
  body{background:#fff; color:#000}
  .shell{padding:0; max-width:none}
  #results{box-shadow:none; background:#fff; padding:0; border-radius:0}
  .print-header{display:block; font-size:15px; font-weight:700; margin-block-end:14px}
  .day-row{border-inline-start-color:#000 !important; break-inside:avoid}
  .month-section{break-inside:avoid; margin-block-end:12px}
  .cat-chip{background:transparent !important; color:#000 !important; border:1px solid #000}
  .mini-chip{background:transparent !important; color:#000 !important; border:1px solid #000}
}
@media (max-width: 640px){
  .day-row .date{width:64px}
  .card{padding:20px}
}

</style>
</head>
<body>
<header class="topbar">
<div class="wordmark"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect x="3.5" y="5.5" width="25" height="23" rx="7.5" stroke="currentColor" stroke-width="2"/>
<path d="M10 3.5v4M22 3.5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M10.5 13.5H18a3 3 0 0 1 0 6h-4a3 3 0 0 0 0 6h7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="10.5" cy="13.5" r="1.8" fill="currentColor"/>
<circle cx="21.5" cy="25.5" r="1.8" fill="currentColor"/>
</svg><span id="wordmarkText">الخطة</span></div>
<div class="topbar-controls">
<button type="button" class="icon-btn" id="facilitiesBtn" aria-label="facilities">🏥</button>
<button type="button" class="icon-btn" id="settingsBtn" aria-label="settings">⚙</button>
<button type="button" class="icon-btn" id="themeToggleBtn" aria-label="theme">◐</button>
<button type="button" class="icon-btn" id="langToggleBtn" aria-label="language">EN</button>
</div>
</header>
<main class="shell">
<section class="card" id="step1"></section>
<section class="card" id="step2"></section>
<section class="card" id="step3"></section>
<button type="button" class="primary-btn" id="generateBtn">توليد الخطة</button>
<section class="card" id="results" hidden></section>
<section class="card" id="review" hidden></section>
<section class="card" id="totals" hidden></section>
</main>
<footer id="footerText"></footer>
<div id="selftestView" hidden></div>
<div id="settingsView" hidden></div>
<div id="facilitiesView" hidden></div>
<script>
function norm(s){
  return (s||'')
    .replace(/\u0640/g,'')
    .replace(/[\u064B-\u0652\u0670]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي')
    .replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[\u0660-\u0669]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48))
    .replace(/[\u06F0-\u06F9]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48))
    .replace(/\s+/g,' ').trim().toLowerCase();
}

const DEFAULT_FACILITY_ALIASES = {
  'التانيه':'الثانية','التانية':'الثانية','الاولى':'الاولي','اشعه':'اشعة',
  'مستشفى':'مستشفي','غسيل كلوى':'غسيل كلوي'
};
const DEFAULT_PERSON_ALIASES = {
  'لبني':'لبنى','اسماء':'أسماء','اباظة':'أباظة','ابظة':'أباظة',
  'شرنوبى':'شرنوبي','ميسره':'ميسرة'
};
let FACILITY_ALIASES = Object.assign({}, DEFAULT_FACILITY_ALIASES);
let PERSON_ALIASES = Object.assign({}, DEFAULT_PERSON_ALIASES);

function applyAlias(getTable){
  return function(raw){
    const n = norm(raw);
    const table = getTable();
    for(const k in table){
      if(norm(k)===n) return norm(table[k]);
    }
    return n;
  };
}
const normFacility = applyAlias(()=>FACILITY_ALIASES);
const normPerson = applyAlias(()=>PERSON_ALIASES);

const MONTHS_AR = {
  'يناير':0,'فبراير':1,'مارس':2,'ابريل':3,'أبريل':3,'مايو':4,'يونيو':5,
  'يوليو':6,'اغسطس':7,'أغسطس':7,'سبتمبر':8,'اكتوبر':9,'أكتوبر':9,'نوفمبر':10,'ديسمبر':11
};
const MONTHS_EN = {
  jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11
};
const WEEKDAY_NAMES_STRIP = /^(sun|mon|tue|wed|thu|fri|sat)\w*\.?\s+/i;

function toAsciiDigits(s){
  return s.replace(/[\u0660-\u0669]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48))
          .replace(/[\u06F0-\u06F9]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48));
}

function parseDateFlexible(raw){
  if(raw==null) return null;
  let s = toAsciiDigits(String(raw)).trim();
  if(!s) return null;
  s = s.replace(WEEKDAY_NAMES_STRIP,'').trim();

  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){
    const y=+m[1], mo=+m[2]-1, d=+m[3];
    return validYMD(y,mo,d);
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    const d=+m[1], mo=+m[2]-1, y=+m[3];
    return validYMD(y,mo,d);
  }
  m = s.match(/^(\d{1,2})\s+([A-Za-z\u0600-\u06FF]+)\.?\s+(\d{4})$/);
  if(m){
    const d=+m[1], y=+m[3];
    const monKey = m[2].trim();
    let mo = MONTHS_AR[monKey];
    if(mo===undefined) mo = MONTHS_EN[monKey.slice(0,3).toLowerCase()];
    if(mo===undefined) return null;
    return validYMD(y,mo,d);
  }
  return null;
}
function validYMD(y,mo,d){
  if(!(y>=1900&&y<=2200)) return null;
  if(!(mo>=0&&mo<=11)) return null;
  const dt = new Date(y,mo,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo||dt.getDate()!==d) return null;
  return dt;
}
function fmtISO(dt){
  const y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,'0'), d=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function daysBetween(a,b){
  const ua = Date.UTC(a.getFullYear(),a.getMonth(),a.getDate());
  const ub = Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((ub-ua)/86400000);
}
function addDays(dt,n){
  return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+n);
}

function workingDays(start,end,weekdays,holidaySet,exceptionSet){
  const out=[];
  let cur = new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const endTime = new Date(end.getFullYear(),end.getMonth(),end.getDate()).getTime();
  while(cur.getTime()<=endTime){
    const iso = fmtISO(cur);
    const isWeekday = weekdays.has(cur.getDay());
    const isHoliday = holidaySet.has(iso);
    const isException = exceptionSet.has(iso);
    if((isWeekday && !isHoliday) || isException){
      out.push(new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()));
    }
    cur = addDays(cur,1);
  }
  return out;
}

function facilityMaxGap(f){
  const hist = f.visitHistory;
  if(!hist || hist.length<2) return null;
  let maxGap = 0;
  for(let i=0;i<hist.length-1;i++){
    const gap = daysBetween(hist[i+1].date, hist[i].date);
    if(gap>maxGap) maxGap = gap;
  }
  return maxGap;
}
function computeNever(facilities){
  let maxGap = 0;
  for(const f of facilities){
    const g = facilityMaxGap(f);
    if(g!=null) maxGap = Math.max(maxGap, g);
  }
  return Math.max(720, maxGap+180);
}

function distanceContext(registry){
  const known = registry.map(f=>f.distanceKm).filter(v=>v!=null).sort((a,b)=>a-b);
  if(known.length < 3) return null;
  const p90 = known[Math.floor(known.length*0.9)] || known[known.length-1];
  const nrm = km => Math.min(1, Math.max(0, km/(p90||1)));
  const mean = known.reduce((s,k)=>s+nrm(k),0)/known.length;
  return {nrm, mean};
}
function distanceTerm(f, dctx, bias){
  if(!dctx || f.distanceKm==null || !bias) return 1;
  return Math.min(2, Math.max(0.15, 1 + bias*(dctx.nrm(f.distanceKm) - dctx.mean)));
}
function rankStream(facilities, planStart, NEVER, dctx, bias){
  const scored = facilities.map(f=>{
    const overdue = f.pinned ? Infinity
      : (f.lastVisit ? daysBetween(f.lastVisit, planStart) : NEVER);
    const weight = f.weight==null?1:f.weight;
    const score = overdue===Infinity ? Infinity : overdue*weight*distanceTerm(f, dctx, bias);
    return {f, overdue, score};
  });
  scored.sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    const va = a.f.visitCount||0, vb = b.f.visitCount||0;
    if(va!==vb) return va-vb;
    return norm(a.f.name)<norm(b.f.name) ? -1 : (norm(a.f.name)>norm(b.f.name)?1:0);
  });
  return scored.map(s=>s.f);
}

function slotBudget(N, mode, opts){
  let M,R;
  if(mode==='ratio'){
    const p = opts.p==null?0.68:opts.p;
    M = Math.round(p*N);
    R = N-M;
  } else {
    M = opts.M; R = opts.R;
  }
  const notes = [];
  if(M+R>N){
    notes.push('mode counts exceed N');
  }
  const basicPoolLen = opts.basicPoolLen, contractedPoolLen = opts.contractedPoolLen;
  const desiredM = M, desiredR = R;
  M = Math.min(M, basicPoolLen);
  R = Math.min(R, contractedPoolLen);
  const shortfallFromBasic = Math.max(0, desiredM-basicPoolLen);
  const shortfallFromContracted = Math.max(0, desiredR-contractedPoolLen);
  if(shortfallFromBasic>0){
    const spareContracted = contractedPoolLen-R;
    const absorb = Math.min(shortfallFromBasic, Math.max(0,spareContracted));
    R += absorb;
    notes.push(`basic pool short by ${shortfallFromBasic}, shifted to contracted`);
  }
  if(shortfallFromContracted>0){
    const spareBasic = basicPoolLen-M;
    const absorb = Math.min(shortfallFromContracted, Math.max(0,spareBasic));
    M += absorb;
    notes.push(`contracted pool short by ${shortfallFromContracted}, shifted to basic`);
  }
  const unused = N-(M+R);
  return {M,R,unused,notes};
}

function interleave(N,M){
  const R = N-M;
  const majorIsBasic = M>=R;
  const a = majorIsBasic ? M : R;
  const out=[];
  for(let i=0;i<N;i++){
    const inMajor = (i*a)%N < a;
    out.push(inMajor===majorIsBasic ? 'basic' : 'contracted');
  }
  return out;
}

function spreadUnusedDays(pattern, unused){
  if(unused<=0) return pattern.slice();
  const N = pattern.length;
  const total = N+unused;
  const out=[];
  let pi=0, placed=0;
  for(let i=0;i<total;i++){
    const shouldBeGap = Math.floor((i*unused)/total) !== Math.floor(((i-1)*unused)/total) && placed<unused;
    if(shouldBeGap){
      out.push(null);
      placed++;
    } else if(pi<pattern.length){
      out.push(pattern[pi++]);
    } else {
      out.push(null);
    }
  }
  return out;
}

function sainteLagueAssign(pool, count, day, ctx){
  const chosen=[];
  const candidates = pool.filter(p=>p.active!==false);
  const usedToday = new Set();
  const gamma = ctx.familiarityGamma==null ? 0.35 : ctx.familiarityGamma;
  for(let slot=0; slot<count; slot++){
    let best=null, bestKey=Infinity, bestIdx=-1;
    for(let idx=0; idx<candidates.length; idx++){
      const p = candidates[idx];
      if(usedToday.has(p.id)) continue;
      if(ctx.isUnavailable && ctx.isUnavailable(p,day)) continue;
      if(ctx.isBlocked && ctx.isBlocked(p,ctx.facility)) continue;
      if(ctx.hardBlockOverTied && ctx.isOverTied && ctx.isOverTied(p,ctx.facility)) continue;
      const assignedCount = ctx.assignedCount[p.id]||0;
      const baseWeight = p.fixedCount!=null
        ? (assignedCount < p.fixedCount ? 1 : 0)
        : (p.weight==null?1:p.weight);
      if(baseWeight<=0) continue;
      const vpf = ctx.facilityPersonVisits ? Math.min(ctx.facilityPersonVisits[ctx.facility.id+'|'+p.id]||0, 6) : 0;
      const dTerm = distanceTerm(ctx.facility, ctx.dctx, p.distanceAffinity||0);
      const effWeight = baseWeight * dTerm * (1/(1+gamma*vpf));
      const finalKey = (assignedCount+0.5)/effWeight;
      if(finalKey<bestKey){
        bestKey=finalKey; best=p; bestIdx=idx;
      }
    }
    if(!best){
      for(let idx=0; idx<candidates.length; idx++){
        const p = candidates[idx];
        if(usedToday.has(p.id)) continue;
        if(ctx.isUnavailable && ctx.isUnavailable(p,day)) continue;
        if(ctx.isBlocked && ctx.isBlocked(p,ctx.facility)) continue;
        if(ctx.hardBlockOverTied && ctx.isOverTied && ctx.isOverTied(p,ctx.facility)) continue;
        best = p; break;
      }
    }
    if(best){
      chosen.push(best);
      usedToday.add(best.id);
      ctx.assignedCount[best.id] = (ctx.assignedCount[best.id]||0)+1;
    }
  }
  return chosen;
}

const BASIC_CATEGORIES = new Set(['ادارة الفرع','الاولي','الثانية','الثالثة']);
const CONTRACTED_CATEGORIES = new Set(['معمل','غسيل كلوي','اشعة','صيدلية','رسم عصب','مستشفي','حضانات']);
const ADMIN_LOW_FREQ_NAMES = new Set(['ادارة الفرع','التوثيق والمعلومات','الشئون الطبية','الشئون القانونية','الملحق','الزراعة']);

function computeWeight(name){
  if(ADMIN_LOW_FREQ_NAMES.has(name)) return 0.5;
  if(name.endsWith('مسائي')) return 0.35;
  return 1;
}
function classifyKind(name, category, location, beheiraLocations){
  if(/مدارس/.test(name)) return 'excluded';
  if(category==='اخري') return 'excluded';
  if(beheiraLocations && !beheiraLocations.has(location)) return 'excluded';
  if(BASIC_CATEGORIES.has(category)) return 'basic';
  if(CONTRACTED_CATEGORIES.has(category)) return 'contracted';
  return 'excluded';
}
function buildRegistry(seedRows){
  const beheiraLocations = new Set(seedRows.map(r=>r[2]));
  return seedRows.map((r,i)=>({
    id:'f_'+i, name:r[0], category:r[1], location:r[2],
    kind: classifyKind(r[0], r[1], r[2], beheiraLocations),
    weight: computeWeight(r[0]),
    lastVisit:null, visitCount:0, pinned:false, manualExcluded:false,
    visitHistory:[], reviewFlag:null,
    distanceKm: LOCATION_DISTANCE_KM[r[2]]!=null ? LOCATION_DISTANCE_KM[r[2]] : null
  }));
}

function teamGenderCounts(row){
  const team=[...row.finTeam,...row.clinTeam];
  const m = team.filter(p=>p.gender==='m').length;
  return {m, f:team.length-m};
}
function isBasicInvalid(row){
  const {m,f} = teamGenderCounts(row);
  return (m===2&&f===2)||(m===4&&f===0)||(m===0&&f===4);
}
function swapPersonBetweenRows(rowA, poolA, personA, rowB, poolB, personB){
  const idxA = rowA[poolA].indexOf(personA);
  const idxB = rowB[poolB].indexOf(personB);
  rowA[poolA][idxA]=personB;
  rowB[poolB][idxB]=personA;
}
function tryFixGenderPair(rowA, rowB){
  for(const pool of ['finTeam','clinTeam']){
    for(const personA of rowA[pool]){
      for(const personB of rowB[pool]){
        if(personA.gender===personB.gender) continue;
        if(rowA[pool].some(p=>p!==personA&&p.id===personB.id)) continue;
        if(rowB[pool].some(p=>p!==personB&&p.id===personA.id)) continue;
        swapPersonBetweenRows(rowA,pool,personA,rowB,pool,personB);
        if(!isBasicInvalid(rowA) && !isBasicInvalid(rowB)) return true;
        swapPersonBetweenRows(rowA,pool,personB,rowB,pool,personA);
      }
    }
  }
  return false;
}
function applyGenderBalance(rows){
  const basicRows = rows.filter(r=>!r.empty && r.kind==='basic');
  const dropped=[];
  let attempts=0;
  let list = basicRows.filter(isBasicInvalid);
  while(list.length>0 && attempts<200){
    const rowA = list[0];
    let fixedWith=null;
    for(let j=1;j<list.length && attempts<200;j++){
      attempts++;
      if(tryFixGenderPair(rowA, list[j])){ fixedWith=list[j]; break; }
    }
    if(!fixedWith){
      dropped.push({date:rowA.date, facility:rowA.facility.name, reason:'gender-balance-no-partner'});
      list = list.filter(r=>r!==rowA);
    } else {
      list = basicRows.filter(isBasicInvalid);
    }
  }
  return dropped;
}

function generatePlan(opts){
  const {
    registry, finPool, clinPool, startDate, endDate, weekdays, holidays, exceptions,
    mode, ratioP, countsM, countsR, applyGender,
    finInitial, clinInitial, isOverTied, isUnavailable, isBlocked,
    facilityPersonVisits, globalDistanceBias, familiarityGamma, hardBlockOverTied
  } = opts;
  const days = workingDays(startDate, endDate, weekdays, holidays, exceptions);
  const N = days.length;
  const basicFac = registry.filter(f=>f.kind==='basic' && !f.manualExcluded);
  const contractedFac = registry.filter(f=>f.kind==='contracted' && !f.manualExcluded);
  const budget = slotBudget(N, mode, {p:ratioP, M:countsM, R:countsR, basicPoolLen:basicFac.length, contractedPoolLen:contractedFac.length});
  const NEVER = computeNever(registry);
  const dctx = distanceContext(registry);
  const bias = globalDistanceBias||0;
  const rankedBasic = rankStream(basicFac, days[0]||startDate, NEVER, dctx, bias);
  const rankedContracted = rankStream(contractedFac, days[0]||startDate, NEVER, dctx, bias);
  const pattern = interleave(budget.M+budget.R, budget.M);
  const withGaps = spreadUnusedDays(pattern, budget.unused);
  let bi=0, ci=0, dayIdx=0;
  const rows=[];
  for(const slot of withGaps){
    if(slot===null){ rows.push({empty:true}); continue; }
    if(slot==='basic'){
      const idx = bi++;
      const f = rankedBasic[idx];
      if(!f){ rows.push({empty:true}); continue; }
      const date = days[dayIdx++];
      rows.push({date, kind:'basic', facility:f, rankInStream: idx+1});
    } else {
      const idx = ci++;
      const f = rankedContracted[idx];
      if(!f){ rows.push({empty:true}); continue; }
      const date = days[dayIdx++];
      rows.push({date, kind:'contracted', facility:f, rankInStream: idx+1});
    }
  }
  const finAssigned = Object.assign({}, finInitial||{});
  const clinAssigned = Object.assign({}, clinInitial||{});
  for(const row of rows){
    if(row.empty) continue;
    const finCount = row.kind==='basic'?2:1;
    const ctx = {facility:row.facility, isUnavailable, isBlocked, isOverTied, dctx, facilityPersonVisits, familiarityGamma, hardBlockOverTied};
    row.finTeam = sainteLagueAssign(finPool, finCount, row.date, Object.assign({}, ctx, {assignedCount:finAssigned}));
    row.clinTeam = sainteLagueAssign(clinPool, 2, row.date, Object.assign({}, ctx, {assignedCount:clinAssigned}));
  }
  let genderDropped=[];
  if(applyGender!==false) genderDropped = applyGenderBalance(rows);
  return {
    rows, budget, N, days, genderDropped, dctx, globalDistanceBias: bias,
    planStart: days[0]||startDate, NEVER,
    leftoverBasic: rankedBasic.slice(budget.M), leftoverContracted: rankedContracted.slice(budget.R),
    pinnedOverflow: [...rankedBasic.slice(budget.M), ...rankedContracted.slice(budget.R)].filter(f=>f.pinned)
  };
}
function displayScore(f, planStart, NEVER, dctx, bias){
  const overdue = f.pinned ? Infinity : (f.lastVisit ? daysBetween(f.lastVisit, planStart) : NEVER);
  return overdue===Infinity ? Infinity : overdue*(f.weight==null?1:f.weight)*distanceTerm(f, dctx, bias);
}
function computeNearMisses(plan, topN){
  topN = topN||10;
  const scored = [...plan.leftoverBasic, ...plan.leftoverContracted].map(f=>({f, score: displayScore(f, plan.planStart, plan.NEVER, plan.dctx, plan.globalDistanceBias)}));
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,topN).map(s=>s.f);
}
function computeThirds(nonEmptyRows){
  const n = nonEmptyRows.length;
  if(n===0) return [{basic:0,contracted:0,total:0},{basic:0,contracted:0,total:0},{basic:0,contracted:0,total:0}];
  const size = Math.ceil(n/3);
  const thirds = [[],[],[]];
  nonEmptyRows.forEach((r,i)=>{
    const idx = Math.min(2, Math.floor(i/size));
    thirds[idx].push(r);
  });
  return thirds.map(t=>({basic:t.filter(r=>r.kind==='basic').length, contracted:t.filter(r=>r.kind==='contracted').length, total:t.length}));
}
function computeDeviation(pool, totals, totalSlots){
  const activeWeightSum = pool.filter(p=>p.active!==false && p.fixedCount==null).reduce((s,p)=>s+(p.weight==null?1:p.weight),0);
  const fixedSum = pool.filter(p=>p.fixedCount!=null).reduce((s,p)=>s+p.fixedCount,0);
  const remainingSlots = Math.max(0, totalSlots-fixedSum);
  return pool.map(p=>{
    const actual = totals[p.id]||0;
    let expected;
    if(p.fixedCount!=null) expected = p.fixedCount;
    else if(p.active===false) expected = 0;
    else expected = activeWeightSum>0 ? (p.weight/activeWeightSum)*remainingSlots : 0;
    return {person:p, actual, expected, deviation: actual-expected};
  });
}

function computeGates(plan, registry, retiredIds){
  const {rows, budget} = plan;
  const nonEmpty = rows.filter(r=>!r.empty);
  const gates=[];
  gates.push({key:'count', pass: nonEmpty.length===(budget.M+budget.R)});
  const facIds = nonEmpty.map(r=>r.facility.id);
  gates.push({key:'dup-facility', pass: new Set(facIds).size===facIds.length});
  let dupPerson=false, wrongSize=false, excludedPresent=false, retiredAssigned=false;
  for(const r of nonEmpty){
    const team=[...r.finTeam,...r.clinTeam];
    if(new Set(team.map(p=>p.id)).size!==team.length) dupPerson=true;
    const expected = r.kind==='basic'?4:3;
    if(team.length!==expected) wrongSize=true;
    if(r.facility.kind==='excluded') excludedPresent=true;
    if(r.facility.manualExcluded) excludedPresent=true;
    if(retiredIds && team.some(p=>retiredIds.has(p.id))) retiredAssigned=true;
  }
  gates.push({key:'dup-person', pass:!dupPerson});
  gates.push({key:'team-size', pass:!wrongSize});
  gates.push({key:'no-excluded', pass:!excludedPresent});
  gates.push({key:'no-retired', pass:!retiredAssigned});
  let prefixOK=true, basicSoFar=0;
  for(let k=0;k<nonEmpty.length;k++){
    if(nonEmpty[k].kind==='basic') basicSoFar++;
    const need = Math.floor((k+1)*budget.M/nonEmpty.length);
    if(basicSoFar<need) prefixOK=false;
  }
  gates.push({key:'prefix', pass:prefixOK});
  let maxRun=0, cur=0;
  for(const r of nonEmpty){
    if(r.kind==='contracted'){ cur++; maxRun=Math.max(maxRun,cur); } else cur=0;
  }
  gates.push({key:'run', pass: budget.M>=budget.R ? maxRun<=1 : true});
  return gates;
}

function computeTotals(rows){
  const finCounts={}, clinCounts={};
  for(const r of rows){
    if(r.empty) continue;
    for(const p of r.finTeam) finCounts[p.id]=(finCounts[p.id]||0)+1;
    for(const p of r.clinTeam) clinCounts[p.id]=(clinCounts[p.id]||0)+1;
  }
  return {finCounts, clinCounts};
}

function escapeXml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function buildCrcTable(){
  const table = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    table[n]=c>>>0;
  }
  return table;
}
const CRC_TABLE = buildCrcTable();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosDateTime(d){
  const time = ((d.getHours()&31)<<11) | ((d.getMinutes()&63)<<5) | ((Math.floor(d.getSeconds()/2))&31);
  const date = (((d.getFullYear()-1980)&127)<<9) | (((d.getMonth()+1)&15)<<5) | (d.getDate()&31);
  return {time, date};
}
function buildZip(files){
  const encoder = new TextEncoder();
  const localParts=[], centralParts=[];
  let offset=0;
  const {time,date} = dosDateTime(new Date());
  for(const f of files){
    const nameBytes = encoder.encode(f.name);
    const dataBytes = typeof f.data==='string' ? encoder.encode(f.data) : f.data;
    const crc = crc32(dataBytes);

    const localHeader = new Uint8Array(30+nameBytes.length);
    const dv = new DataView(localHeader.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
    dv.setUint16(8,0,true); dv.setUint16(10,time,true); dv.setUint16(12,date,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,dataBytes.length,true); dv.setUint32(22,dataBytes.length,true);
    dv.setUint16(26,nameBytes.length,true); dv.setUint16(28,0,true);
    localHeader.set(nameBytes,30);
    localParts.push(localHeader, dataBytes);

    const centralHeader = new Uint8Array(46+nameBytes.length);
    const cdv = new DataView(centralHeader.buffer);
    cdv.setUint32(0,0x02014b50,true); cdv.setUint16(4,20,true); cdv.setUint16(6,20,true);
    cdv.setUint16(8,0,true); cdv.setUint16(10,0,true); cdv.setUint16(12,time,true); cdv.setUint16(14,date,true);
    cdv.setUint32(16,crc,true); cdv.setUint32(20,dataBytes.length,true); cdv.setUint32(24,dataBytes.length,true);
    cdv.setUint16(28,nameBytes.length,true); cdv.setUint16(30,0,true); cdv.setUint16(32,0,true);
    cdv.setUint16(34,0,true); cdv.setUint16(36,0,true); cdv.setUint32(38,0,true); cdv.setUint32(42,offset,true);
    centralHeader.set(nameBytes,46);
    centralParts.push(centralHeader);

    offset += localHeader.length + dataBytes.length;
  }
  const centralStart = offset;
  let centralSize=0;
  for(const c of centralParts) centralSize += c.length;
  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0,0x06054b50,true); edv.setUint16(4,0,true); edv.setUint16(6,0,true);
  edv.setUint16(8,files.length,true); edv.setUint16(10,files.length,true);
  edv.setUint32(12,centralSize,true); edv.setUint32(16,centralStart,true); edv.setUint16(20,0,true);

  const allParts=[...localParts,...centralParts,eocd];
  let total=0;
  for(const p of allParts) total+=p.length;
  const out = new Uint8Array(total);
  let pos=0;
  for(const p of allParts){ out.set(p,pos); pos+=p.length; }
  return out;
}

function colLetter(i){
  let s='';
  i=i+1;
  while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); }
  return s;
}
function buildXlsxBytes(headerRow, dataRows, colWidths){
  const allRows = [headerRow, ...dataRows];
  const colsXml = (colWidths||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const rowsXml = allRows.map((row,ri)=>{
    const cells = row.map((val,ci)=>{
      const ref = colLetter(ci)+(ri+1);
      if(typeof val==='number') return `<c r="${ref}"><v>${val}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escapeXml(val)}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}">${cells}</row>`;
  }).join('');

  const sheet1 = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>
${colsXml?('<cols>'+colsXml+'</cols>'):''}
<sheetData>${rowsXml}</sheetData>
</worksheet>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`;

  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets>
</workbook>`;

  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`;

  return buildZip([
    {name:'[Content_Types].xml', data:contentTypes},
    {name:'_rels/.rels', data:rootRels},
    {name:'xl/workbook.xml', data:workbook},
    {name:'xl/_rels/workbook.xml.rels', data:workbookRels},
    {name:'xl/worksheets/sheet1.xml', data:sheet1}
  ]);
}

function colToIndex(ref){
  const m = ref.match(/^([A-Z]+)/);
  if(!m) return 0;
  let col=0;
  for(const ch of m[1]) col = col*26 + (ch.charCodeAt(0)-64);
  return col-1;
}

async function readZipEntries(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);
  let eocdOffset=-1;
  for(let i=bytes.length-22; i>=Math.max(0,bytes.length-22-65557); i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocdOffset=i; break; }
  }
  if(eocdOffset<0) throw new Error('not a valid zip: EOCD not found');
  const entryCount = dv.getUint16(eocdOffset+10,true);
  const centralOffset = dv.getUint32(eocdOffset+16,true);

  const entries = new Map();
  let ptr = centralOffset;
  for(let i=0;i<entryCount;i++){
    if(dv.getUint32(ptr,true)!==0x02014b50) throw new Error('bad central directory entry');
    const method = dv.getUint16(ptr+10,true);
    const compSize = dv.getUint32(ptr+20,true);
    const nameLen = dv.getUint16(ptr+28,true);
    const extraLen = dv.getUint16(ptr+30,true);
    const commentLen = dv.getUint16(ptr+32,true);
    const localOffset = dv.getUint32(ptr+42,true);
    const name = new TextDecoder('utf-8').decode(bytes.subarray(ptr+46, ptr+46+nameLen));

    const lNameLen = dv.getUint16(localOffset+26,true);
    const lExtraLen = dv.getUint16(localOffset+28,true);
    const dataStart = localOffset+30+lNameLen+lExtraLen;
    const compressed = bytes.subarray(dataStart, dataStart+compSize);

    if(method===0){
      entries.set(name, compressed.slice());
    } else if(method===8){
      if(typeof DecompressionStream==='undefined'){
        entries.set(name, null);
      } else {
        const ds = new DecompressionStream('deflate-raw');
        const source = new ReadableStream({
          start(controller){ controller.enqueue(compressed); controller.close(); }
        });
        const buf = await new Response(source.pipeThrough(ds)).arrayBuffer();
        entries.set(name, new Uint8Array(buf));
      }
    } else {
      entries.set(name, null);
    }
    ptr += 46+nameLen+extraLen+commentLen;
  }
  return entries;
}

function parseSharedStrings(xmlText){
  if(!xmlText) return [];
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const items = [...doc.getElementsByTagName('si')];
  return items.map(si=>{
    const tNodes = [...si.getElementsByTagName('t')];
    return tNodes.map(t=>t.textContent).join('');
  });
}
function parseSheetRows(xmlText, sharedStrings){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const rowEls = [...doc.getElementsByTagName('row')];
  return rowEls.map(rowEl=>{
    const cells = [...rowEl.getElementsByTagName('c')];
    const row = [];
    for(const c of cells){
      const ref = c.getAttribute('r')||'';
      const idx = colToIndex(ref);
      const type = c.getAttribute('t');
      let value = '';
      if(type==='inlineStr'){
        const isEl = c.getElementsByTagName('is')[0];
        value = isEl ? [...isEl.getElementsByTagName('t')].map(t=>t.textContent).join('') : '';
      } else {
        const vEl = c.getElementsByTagName('v')[0];
        const raw = vEl ? vEl.textContent : '';
        if(type==='s') value = sharedStrings[+raw] || '';
        else value = raw;
      }
      while(row.length<idx) row.push('');
      row[idx] = value;
    }
    return row;
  });
}
async function parseXlsxArrayBuffer(arrayBuffer){
  const entries = await readZipEntries(arrayBuffer);
  const decoder = new TextDecoder('utf-8');
  const sheetBytes = entries.get('xl/worksheets/sheet1.xml');
  if(sheetBytes===undefined) throw new Error('xl/worksheets/sheet1.xml not found');
  if(sheetBytes===null) throw new Error('unsupported compression in this browser');
  const sharedBytes = entries.get('xl/sharedStrings.xml');
  const sharedStrings = sharedBytes ? parseSharedStrings(decoder.decode(sharedBytes)) : [];
  return parseSheetRows(decoder.decode(sheetBytes), sharedStrings);
}

function stripBOM(text){
  return text.charCodeAt(0)===0xFEFF ? text.slice(1) : text;
}
function parseCSV(text){
  text = stripBOM(text);
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1&&r[0]===''));
}
function parseTSV(text){
  text = stripBOM(text);
  return text.replace(/\r/g,'').split('\n').filter(l=>l.length).map(l=>l.split('\t'));
}
function toCSV(rows){
  const esc = v=>{
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  return '\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n');
}
function toTSVLine(row){ return row.join('\t'); }

const HEADER_ALIASES = {
  'جهة المرور':'facility', 'المنطقة':'category', 'الخطة':'cycle',
  'المرور':'typeLabel', 'التاريخ':'date', 'القائم بالمرور':'team'
};
function mapHeaders(headerRow){
  const mapping = {};
  const usedCols = new Set();
  headerRow.forEach((h,idx)=>{
    const n = norm(h);
    for(const key in HEADER_ALIASES){
      if(norm(key)===n && !usedCols.has(HEADER_ALIASES[key])){
        mapping[HEADER_ALIASES[key]] = idx;
        usedCols.add(HEADER_ALIASES[key]);
      }
    }
  });
  const required = ['facility','category','cycle','typeLabel','date','team'];
  const unmapped = required.filter(k=>!(k in mapping));
  return {mapping, unmapped};
}

}

  return saved.map(f=>Object.assign({}, f, {
    lastVisit: f.lastVisit ? parseDateFlexible(f.lastVisit) : null,
    visitHistory: (f.visitHistory||[]).map(v=>({date: parseDateFlexible(v.date), team: v.team})).filter(v=>v.date)
  }));
}

function ingestHistory(records, registry, finPool, clinPool, retiredPool, personAliasOverrides){
  personAliasOverrides = personAliasOverrides || {};
  const registryByName = new Map(registry.map(f=>[normFacility(f.name), f]));
  const finByName = new Map(finPool.map(p=>[normPerson(p.name), p]));
  const clinByName = new Map(clinPool.map(p=>[normPerson(p.name), p]));
  const retiredByName = new Map(retiredPool.map(p=>[normPerson(p.name), p]));

  const unresolvedFacilities = [];
  const unresolvedPeople = new Map();
  const unparseableRows = [];
  const facilityPersonVisits = {};
  const initialFin = {}, initialClin = {};
  let maxCycle = -1;
  let matchedRowCount = 0;

  for(const rec of records){
    const cycleNum = parseInt(String(rec.cycleRaw).trim(), 10);
    if(!isNaN(cycleNum)) maxCycle = Math.max(maxCycle, cycleNum);

    const date = parseDateFlexible(rec.dateRaw);
    if(!date){ unparseableRows.push({rowIndex:rec.rowIndex, reason:'date', raw:rec.dateRaw}); continue; }

    const fKey = normFacility(rec.facilityRaw);
    let facility = registryByName.get(fKey);
    if(!facility){
      const cat = rec.categoryRaw.trim();
      const isBasic = BASIC_CATEGORIES.has(cat), isContracted = CONTRACTED_CATEGORIES.has(cat);
      facility = {
        id:'hist_'+registry.length,
        name: rec.facilityRaw.trim(), category: cat, location:null,
        kind: isBasic ? 'basic' : (isContracted ? 'contracted' : 'excluded'),
        weight: computeWeight(rec.facilityRaw.trim()),
        lastVisit:null, visitCount:0, pinned:false, manualExcluded:false, visitHistory:[], reviewFlag:'unknown-location'
      };
      registry.push(facility);
      registryByName.set(fKey, facility);
      unresolvedFacilities.push(facility);
    }
    facility.visitCount = (facility.visitCount||0)+1;
    if(!facility.lastVisit || date>facility.lastVisit) facility.lastVisit = date;
    matchedRowCount++;

    const names = rec.teamRaw.split('-').map(s=>s.trim()).filter(Boolean);
    if(!facility.visitHistory) facility.visitHistory = [];
    facility.visitHistory.push({date, team: names});
    facility.visitHistory.sort((a,b)=>b.date-a.date);
    if(facility.visitHistory.length>20) facility.visitHistory.length = 20;
    for(const rawName of names){
      const pKey = normPerson(rawName);
      const override = personAliasOverrides[pKey];
      let person=null, pool=null;
      if(override){
        if(override.pool==='fin') person = finPool.find(p=>p.id===override.id);
        else if(override.pool==='clin') person = clinPool.find(p=>p.id===override.id);
        else if(override.pool==='retired') pool='retired';
        if(person) pool = override.pool;
      }
      if(!person && pool!=='retired'){
        if(finByName.has(pKey)){ person=finByName.get(pKey); pool='fin'; }
        else if(clinByName.has(pKey)){ person=clinByName.get(pKey); pool='clin'; }
        else if(retiredByName.has(pKey)){ pool='retired'; }
      }
      if(person){
        const bucket = pool==='fin' ? initialFin : initialClin;
        bucket[person.id] = (bucket[person.id]||0)+1;
        const key = facility.id+'|'+person.id;
        facilityPersonVisits[key] = (facilityPersonVisits[key]||0)+1;
      } else if(pool==='retired'){
      } else {
        const entry = unresolvedPeople.get(pKey) || {name: rawName.trim(), count:0};
        entry.count++;
        unresolvedPeople.set(pKey, entry);
      }
    }
  }
  return {
    unresolvedFacilities, unresolvedPeople, unparseableRows, facilityPersonVisits,
    initialFin, initialClin, maxCycle, matchedRowCount, totalRows: records.length
  };
}

function makeOverTiedChecker(facilityPersonVisits, minVisits, minRatio){
  minVisits = minVisits==null ? 3 : minVisits;
  minRatio = minRatio==null ? 0.6 : minRatio;
  return function(person, facility){
    const key = facility.id+'|'+person.id;
    const v = facilityPersonVisits[key]||0;
    if(v<minVisits) return false;
    const total = facility.visitCount||0;
    if(total<=0) return false;
    return (v/total) >= minRatio;
  };
}
function makeUnavailableChecker(){
  return function(person, date){
    if(!person.unavailable || !person.unavailable.length) return false;
    return person.unavailable.indexOf(fmtISO(date))>=0;
  };
}
function makeBlockedChecker(){
  return function(person, facility){
    if(!person.blockedFacilities || !person.blockedFacilities.length) return false;
    return person.blockedFacilities.indexOf(facility.id)>=0 || person.blockedFacilities.indexOf(facility.name)>=0;
  };
}

const REGISTRY_HEADER_ALIASES = {
  'اسم الجهة':'name', 'المنطقة':'category', 'الموقع':'location', 'الوزن':'weight', 'الحالة':'status', 'المسافة':'distance'
};
function mapRegistryHeaders(headerRow){
  const mapping = {};
  const usedCols = new Set();
  headerRow.forEach((h,idx)=>{
    const n = norm(h);
    for(const key in REGISTRY_HEADER_ALIASES){
      if(norm(key)===n && !usedCols.has(REGISTRY_HEADER_ALIASES[key])){
        mapping[REGISTRY_HEADER_ALIASES[key]] = idx;
        usedCols.add(REGISTRY_HEADER_ALIASES[key]);
      }
    }
  });
  const required = ['name','category','location','weight','status'];
  const unmapped = required.filter(k=>!(k in mapping));
  return {mapping, unmapped};
}
function parseRegistryRows(rawRows, mapping){
  return rawRows.map((r,i)=>({
    rowIndex:i,
    nameRaw: (r[mapping.name]||'').toString(),
    categoryRaw: (r[mapping.category]||'').toString(),
    locationRaw: (r[mapping.location]||'').toString(),
    weightRaw: r[mapping.weight],
    statusRaw: (r[mapping.status]||'').toString(),
    distanceRaw: mapping.distance!=null ? r[mapping.distance] : undefined
  })).filter(r=>r.nameRaw.trim()!=='');
}
function parseStatusValue(raw){
  const n = norm(raw);
  if(n===norm('مستبعدة')) return 'excluded';
  if(n===norm('مثبتة')) return 'pinned';
  return 'included';
}
function statusToArabic(status){
  if(status==='excluded') return 'مستبعدة';
  if(status==='pinned') return 'مثبّتة';
  return 'مُدرجة';
}
function parseDistanceRaw(raw){
  if(raw==null || raw==='') return null;
  const v = parseFloat(raw);
  return isNaN(v) ? null : v;
}
function computeRegistryDiff(records, currentRegistry){
  const byName = new Map(currentRegistry.map(f=>[normFacility(f.name), f]));
  const seenNames = new Set();
  const added=[], changed=[], unparseable=[];
  for(const rec of records){
    const name = rec.nameRaw.trim();
    const weight = parseFloat(rec.weightRaw);
    if(isNaN(weight)){ unparseable.push({rowIndex:rec.rowIndex, reason:'weight', raw:rec.weightRaw}); continue; }
    const status = parseStatusValue(rec.statusRaw);
    const category = rec.categoryRaw.trim();
    const location = rec.locationRaw.trim();
    const distanceKm = parseDistanceRaw(rec.distanceRaw);
    const key = normFacility(name);
    seenNames.add(key);
    const existing = byName.get(key);
    const categoryKnown = BASIC_CATEGORIES.has(category) || CONTRACTED_CATEGORIES.has(category);
    const kind = categoryKnown ? (BASIC_CATEGORIES.has(category)?'basic':'contracted') : 'excluded';
    const categoryFlag = categoryKnown ? null : 'unknown-category';
    if(!existing){
      added.push({name, category, location, weight, status, kind, categoryFlag, distanceKm});
    } else {
      const fields=[];
      if(existing.category!==category) fields.push({field:'category', from:existing.category, to:category});
      if((existing.location||'')!==location) fields.push({field:'location', from:existing.location||'', to:location});
      if(existing.weight!==weight) fields.push({field:'weight', from:existing.weight, to:weight});
      const existingStatus = existing.manualExcluded ? 'excluded' : (existing.pinned ? 'pinned' : 'included');
      if(existingStatus!==status) fields.push({field:'status', from:existingStatus, to:status});
      if((existing.distanceKm==null?null:existing.distanceKm)!==distanceKm) fields.push({field:'distanceKm', from:existing.distanceKm, to:distanceKm});
      if(fields.length) changed.push({existing, name, category, location, weight, status, kind, categoryFlag, distanceKm, fields});
    }
  }
  const missing = currentRegistry.filter(f=>!seenNames.has(normFacility(f.name)));
  return {added, changed, missing, unparseable, totalRows:records.length};
}
function applyRegistryDiff(diff, registry, missingActions){
  missingActions = missingActions || {};
  for(const a of diff.added){
    registry.push({
      id:'reg_'+registry.length+'_'+Math.random().toString(36).slice(2,8),
      name:a.name, category:a.category, location:a.location||null,
      kind:a.kind, weight:a.weight, distanceKm: a.distanceKm==null?null:a.distanceKm,
      lastVisit:null, visitCount:0, pinned:a.status==='pinned', manualExcluded:a.status==='excluded',
      visitHistory:[], reviewFlag:a.categoryFlag
    });
  }
  for(const c of diff.changed){
    const f = c.existing;
    f.category = c.category; f.location = c.location||null; f.weight = c.weight;
    f.pinned = c.status==='pinned'; f.manualExcluded = c.status==='excluded';
    f.kind = c.kind; f.reviewFlag = c.categoryFlag; f.distanceKm = c.distanceKm==null?null:c.distanceKm;
  }
  for(const f of diff.missing){
    if(missingActions[f.id]==='exclude') f.manualExcluded = true;
  }
}


async function runSelfTests(){
  const results=[];
  function check(name, fn){
    try{
      const detail = fn();
      results.push({name, status:'pass', detail: detail||''});
    }catch(e){
      results.push({name, status:'fail', detail: e.message});
    }
  }
  async function checkAsync(name, fn){
    try{
      const detail = await fn();
      results.push({name, status:'pass', detail: detail||''});
    }catch(e){
      results.push({name, status:'fail', detail: e.message});
    }
  }

  check('interleave: exact M basic slots for N∈[1,80]×M∈[0,N]', ()=>{
    let checked=0;
    for(let N=1;N<=80;N++){
      for(let M=0;M<=N;M++){
        const pattern = interleave(N,M);
        const c = pattern.filter(x=>x==='basic').length;
        if(c!==M) throw new Error(`N=${N} M=${M} got ${c}`);
        checked++;
      }
    }
    return `${checked} combinations checked`;
  });

  check('interleave: no two consecutive minority slots', ()=>{
    let checked=0;
    for(let N=1;N<=80;N++){
      for(let M=0;M<=N;M++){
        const pattern = interleave(N,M);
        const R=N-M, majorIsBasic=M>=R;
        const minor = majorIsBasic?'contracted':'basic';
        for(let i=0;i<pattern.length-1;i++){
          if(pattern[i]===minor&&pattern[i+1]===minor) throw new Error(`N=${N} M=${M} at ${i}`);
        }
        checked++;
      }
    }
    return `${checked} combinations checked`;
  });

  check('interleave: prefix gate holds for all N,M', ()=>{
    let checked=0;
    for(let N=1;N<=80;N++){
      for(let M=0;M<=N;M++){
        const pattern = interleave(N,M);
        let basicSoFar=0;
        for(let k=1;k<=N;k++){
          if(pattern[k-1]==='basic') basicSoFar++;
          const need = Math.floor(k*M/N);
          if(basicSoFar<need) throw new Error(`N=${N} M=${M} k=${k}`);
        }
        checked++;
      }
    }
    return `${checked} combinations checked`;
  });

  check('norm(): collapses known facility alias pairs', ()=>{
    if(normFacility('التانية')!==normFacility('الثانية')) throw new Error('الثانية/التانية');
    if(normFacility('اشعه')!==normFacility('اشعة')) throw new Error('اشعة/اشعه');

    for(const r of cycle1.rows){
      if(r.empty) continue;
      for(const p of r.finTeam){ const k=r.facility.id+'|'+p.id; fpv[k]=(fpv[k]||0)+1; finAfterCycle1[p.id]=(finAfterCycle1[p.id]||0)+1; }
    }
    const cycle1Team = cycle1.rows.find(r=>!r.empty && r.facility.id===trackedId).finTeam.map(p=>p.id);
    const cycle2 = withDiscount=>{
      const a = args(); a.finInitial = finAfterCycle1;
      if(withDiscount) a.facilityPersonVisits = fpv;
      return generatePlan(a).rows.find(r=>!r.empty && r.facility.id===trackedId).finTeam.map(p=>p.id);
    };
    const teamNo = cycle2(false), teamYes = cycle2(true);
    const distinctNo = new Set([...cycle1Team, ...teamNo]).size;
    const distinctYes = new Set([...cycle1Team, ...teamYes]).size;
    if(!(distinctYes > distinctNo)) throw new Error(`distinct visitors did not increase: without=${distinctNo} with=${distinctYes}`);
    return `without discount=${distinctNo} distinct, with discount=${distinctYes} distinct`;
  });

  check('registry export→import round-trips weights and status unchanged', ()=>{
    const registry = buildRegistry(REGISTRY_SEED);
    registry[0].weight = 0.42;
    registry[1].manualExcluded = true;
    registry[2].pinned = true;
    const serialized = serializeRegistry(registry);
    const roundTripped = deserializeRegistry(JSON.parse(JSON.stringify(serialized)));
    if(roundTripped[0].weight!==0.42) throw new Error('weight not preserved');
    if(roundTripped[1].manualExcluded!==true) throw new Error('manualExcluded not preserved');
    if(roundTripped[2].pinned!==true) throw new Error('pinned not preserved');
    return 'ok';
  });

  check('manually excluded facility never appears in a generated plan', ()=>{
    const registry = buildRegistry(REGISTRY_SEED);
    registry.filter(f=>f.kind==='basic').forEach((f,i)=>{ if(i%2===0) f.manualExcluded = true; });
    const finPool = FIN_ADMIN_SEED.map(freshPerson);
    const clinPool = CLINICAL_SEED.map(freshPerson);
    const plan = generatePlan({
      registry, finPool, clinPool,
      startDate:new Date(2026,8,1), endDate:new Date(2026,10,30),
      weekdays:new Set([1,2,3,4]), holidays:new Set(), exceptions:new Set(),
      mode:'ratio', ratioP:0.68
    });
    for(const r of plan.rows){
      if(!r.empty && r.facility.manualExcluded) throw new Error(`excluded facility ${r.facility.name} appeared on ${r.date}`);
    }
    const retiredIds = new Set(RETIRED_SEED.map(p=>p.id));
    const gates = computeGates(plan, registry, retiredIds);
    if(!gates.find(g=>g.key==='no-excluded').pass) throw new Error('no-excluded gate failed to catch it');
    return 'ok';
  });

  check('registry import diff applied twice is idempotent', ()=>{
    const registry = buildRegistry(REGISTRY_SEED);
    const header = ['اسم الجهة','المنطقة','الموقع','الوزن','الحالة'];
    const rows = [['مركز دمنهور للاشعة','اشعة','دمنهور','0.6','مُدرجة'],['ابو حمص','الثانية','ابو حمص','1','مستبعدة']];
    const {mapping} = mapRegistryHeaders(header);
    const records = parseRegistryRows(rows, mapping);
    const diff1 = computeRegistryDiff(records, registry);
    applyRegistryDiff(diff1, registry, {});
    const diff2 = computeRegistryDiff(records, registry);
    if(diff2.added.length!==0 || diff2.changed.length!==0) throw new Error(`second diff not empty: added=${diff2.added.length} changed=${diff2.changed.length}`);
    return 'ok';
  });

  check('registry importer: optional المسافة column maps to distanceKm, absent column stays null', ()=>{
    const registryA = buildRegistry(REGISTRY_SEED);
    const headerWith = ['اسم الجهة','المنطقة','الموقع','الوزن','الحالة','المسافة'];
    const rowsWith = [['مركز دمنهور للاشعة','اشعة','دمنهور','0.6','مُدرجة','12.5']];
    const {mapping:mapWith} = mapRegistryHeaders(headerWith);
    const recordsWith = parseRegistryRows(rowsWith, mapWith);
    const diffWith = computeRegistryDiff(recordsWith, registryA);
    applyRegistryDiff(diffWith, registryA, {});
    const damWith = registryA.find(f=>f.name==='مركز دمنهور للاشعة');
    if(damWith.distanceKm!==12.5) throw new Error('distanceKm not mapped from المسافة column: '+damWith.distanceKm);

    const registryB = buildRegistry(REGISTRY_SEED);
    const headerWithout = ['اسم الجهة','المنطقة','الموقع','الوزن','الحالة'];
    const rowsWithout = [['مركز دمنهور للاشعة','اشعة','دمنهور','0.6','مُدرجة']];
    const {mapping:mapWithout} = mapRegistryHeaders(headerWithout);
    const recordsWithout = parseRegistryRows(rowsWithout, mapWithout);
    const diffWithout = computeRegistryDiff(recordsWithout, registryB);
    applyRegistryDiff(diffWithout, registryB, {});
    const damWithout = registryB.find(f=>f.name==='مركز دمنهور للاشعة');
    if(damWithout.distanceKm!==null) throw new Error('distanceKm should stay null when column absent: '+damWithout.distanceKm);
    return 'ok';
  });

  return results;
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
    else if(k==='html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if(children!=null) for(const c of [].concat(children)){
    if(c==null) continue;
    e.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  }
  return e;
}

    const s = JSON.parse(raw);
    if(s.range) state.range = s.range;
    if(Array.isArray(s.weekdays)) state.weekdays = new Set(s.weekdays);
    if(Array.isArray(s.holidays)) state.holidays = new Set(s.holidays);
    if(s.ratioP!=null) state.ratioP = s.ratioP;
    if(s.customStart) state.customStart = s.customStart;
    if(s.customEnd) state.customEnd = s.customEnd;
    if(s.overTieMinVisits!=null) state.overTieMinVisits = s.overTieMinVisits;
    if(s.overTieMinRatio!=null) state.overTieMinRatio = s.overTieMinRatio;
    if(s.applyGenderPass!=null) state.applyGenderPass = s.applyGenderPass;
    if(s.globalDistanceBias!=null) state.globalDistanceBias = s.globalDistanceBias;
    if(s.familiarityGamma!=null) state.familiarityGamma = s.familiarityGamma;

  const facilityExtra = {}, personExtra = {};
  for(const k in FACILITY_ALIASES) if(!(k in DEFAULT_FACILITY_ALIASES)) facilityExtra[k]=FACILITY_ALIASES[k];
  for(const k in PERSON_ALIASES) if(!(k in DEFAULT_PERSON_ALIASES)) personExtra[k]=PERSON_ALIASES[k];
  localStorage.setItem('alkhitta.aliasOverrides', JSON.stringify({facility:facilityExtra, person:personExtra}));
}
function loadPeople(){
  let overrides = {fin:{}, clin:{}};
  try{
    const raw = localStorage.getItem('alkhitta.people');
    if(raw) overrides = JSON.parse(raw);
  }catch(e){}
  const custom = loadCustomPeople();
  const fin = FIN_ADMIN_SEED.concat(custom.fin||[]).map(p=>Object.assign(freshPerson(p), overrides.fin&&overrides.fin[p.id]||{}));
  const clin = CLINICAL_SEED.concat(custom.clin||[]).map(p=>Object.assign(freshPerson(p), overrides.clin&&overrides.clin[p.id]||{}));
  return {fin, clin};
}
function savePeople(){
  const obj = {fin:{}, clin:{}};
  for(const p of state.finPool) obj.fin[p.id] = {weight:p.weight, active:p.active, name:p.name, gender:p.gender, fixedCount:p.fixedCount, unavailable:p.unavailable, blockedFacilities:p.blockedFacilities, distanceAffinity:p.distanceAffinity};
  for(const p of state.clinPool) obj.clin[p.id] = {weight:p.weight, active:p.active, name:p.name, gender:p.gender, fixedCount:p.fixedCount, unavailable:p.unavailable, blockedFacilities:p.blockedFacilities, distanceAffinity:p.distanceAffinity};
  localStorage.setItem('alkhitta.people', JSON.stringify(obj));
  const customFin = state.finPool.filter(p=>p.id.indexOf('p_custom_')===0);
  const customClin = state.clinPool.filter(p=>p.id.indexOf('p_custom_')===0);
  localStorage.setItem('alkhitta.customPeople', JSON.stringify({fin:customFin, clin:customClin}));
}
function loadCustomPeople(){
  try{
    const raw = localStorage.getItem('alkhitta.customPeople');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {fin:[], clin:[]};
}
function loadRegistry(){
  const seedFresh = buildRegistry(REGISTRY_SEED);
  try{
    const raw = localStorage.getItem('alkhitta.registry');
    if(raw){
      const saved = JSON.parse(raw);
      if(Array.isArray(saved) && saved.length){
        const merged = deserializeRegistry(saved);
        const existingNames = new Set(merged.map(f=>normFacility(f.name)));
        for(const f of seedFresh) if(!existingNames.has(normFacility(f.name))) merged.push(f);
        return merged;
      }
    }
  }catch(e){}
  return seedFresh;
}
function saveRegistry(){
  localStorage.setItem('alkhitta.registry', JSON.stringify(serializeRegistry(state.registry)));
}
function loadPersonAliases(){
  try{
    const raw = localStorage.getItem('alkhitta.personAliases');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function savePersonAliases(){
  localStorage.setItem('alkhitta.personAliases', JSON.stringify(state.personAliasOverrides));
}


function rowsFromParsedFile(name, text, buf){
  const lower = name.toLowerCase();
  if(lower.endsWith('.csv')) return {rows: parseCSV(text), kind:'csv'};
  if(lower.endsWith('.tsv') || lower.endsWith('.txt')) return {rows: parseTSV(text), kind:'tsv'};
  return null;
}
async function handleFileUpload(file){
  state.importError = null;
  state.pendingRemap = null;
  try{
    const name = file.name || '';
    let rows;
    if(/\.xlsx$/i.test(name)){
      const buf = await file.arrayBuffer();
      rows = await parseXlsxArrayBuffer(buf);
    } else if(/\.csv$/i.test(name)){
      rows = parseCSV(await file.text());
    } else {
      rows = parseTSV(await file.text());
    }
    proceedWithRows(rows);
  }catch(e){
    state.importError = t('importErrorPrefix')+e.message;
    render();
  }
}
function handlePasteImport(text){
  state.importError = null;
  state.pendingRemap = null;
  try{
    const rows = text.indexOf('\t')>=0 ? parseTSV(text) : parseCSV(text);
    proceedWithRows(rows);
  }catch(e){
    state.importError = t('importErrorPrefix')+e.message;
    render();
  }
}
function proceedWithRows(rows){
  if(!rows || !rows.length){ state.importError='—'; render(); return; }
  const headerRow = rows[0];
  const {mapping, unmapped} = mapHeaders(headerRow);
  if(unmapped.length){
    state.pendingRemap = {headerRow, rows, unmapped, mapping};
    render();
    return;
  }
  finalizeImport(headerRow, rows.slice(1), mapping);
}
function applyRemap(chosenMapping){
  const pending = state.pendingRemap;
  state.pendingRemap = null;
  finalizeImport(pending.headerRow, pending.rows.slice(1), chosenMapping);
}
function finalizeImport(headerRow, dataRows, mapping){
  state.baseRegistryBeforeImport = cloneRegistry(state.registry);
  state.importedRecords = parseHistoryRows(dataRows, mapping);
  state.planApproved = false;
  runIngestion();
}
function runIngestion(){
  const working = cloneRegistry(state.baseRegistryBeforeImport);
  const result = ingestHistory(state.importedRecords, working, state.finPool, state.clinPool, RETIRED_SEED, state.personAliasOverrides);
  state.registry = working;
  state.importResult = result;
  saveRegistry();
  render();
}
function resolvePerson(pKey, rawName, action, gender){
  if(action==='retire'){
    state.personAliasOverrides[pKey] = {pool:'retired'};
  } else if(action==='add-fin' || action==='add-clin'){
    const pool = action==='add-fin' ? state.finPool : state.clinPool;
    const id = 'p_custom_'+pKey.replace(/[^a-z0-9\u0600-\u06FF]+/gi,'_');
    if(!pool.find(p=>p.id===id)) pool.push(freshPerson({id, name: rawName, gender: gender||'m'}));
    state.personAliasOverrides[pKey] = {pool: action==='add-fin'?'fin':'clin', id};
  } else if(action.indexOf('map:')===0){
    const id = action.slice(4);
    const pool = state.finPool.find(p=>p.id===id) ? 'fin' : 'clin';
    state.personAliasOverrides[pKey] = {pool, id};
  } else {
    return;
  }
  savePersonAliases();
  savePeople();
  runIngestion();
}

function planToRows(plan, cycleNumber){
  const out=[];
  for(const row of plan.rows){
    if(row.empty) continue;
    if(state.hiddenFacilityIds && state.hiddenFacilityIds.has(row.facility.id)) continue;
    const team = [...row.finTeam, ...row.clinTeam]
      .filter(p=>!(state.hiddenPersonIds && state.hiddenPersonIds.has(p.id)))
      .map(p=>p.name).join(' - ');
    out.push([row.facility.name, row.facility.category, cycleNumber, 'خطة المرور', formatDateForExport(row.date), team]);
  }
  return out;
}
function formatDateForExport(date){
  const wdShort = WEEKDAY_SHORT_EN[date.getDay()];
  const mon = MONTH_NAMES_EN[date.getMonth()].slice(0,3);
  return `${wdShort} ${date.getDate()} ${mon} ${date.getFullYear()}`;
}
function currentCycleNumber(){
  return (state.importResult ? state.importResult.maxCycle : -1) + 1;
}
function downloadBlob(data, filename, mime){
  const blob = new Blob([data], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportXlsx(){
  const dataRows = planToRows(state.plan, currentCycleNumber());
  const bytes = buildXlsxBytes(OOXML_HEADERS, dataRows, [28,14,8,14,16,34]);
  downloadBlob(bytes, 'alkhitta-plan.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function exportCsv(){
  const dataRows = planToRows(state.plan, currentCycleNumber());
  downloadBlob(toCSV([OOXML_HEADERS, ...dataRows]), 'alkhitta-plan.csv', 'text/csv;charset=utf-8');
}
function copyTsv(){
  const dataRows = planToRows(state.plan, currentCycleNumber());
  const text = [OOXML_HEADERS, ...dataRows].map(r=>r.join('\t')).join('\n');
  copyTextToClipboard(text).then(()=>{
    state.copyFeedback = t('tsvCopied');
    renderResults();
    setTimeout(()=>{ state.copyFeedback = null; renderResults(); }, 2000);
  });
}
function copyTextToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
function exportBackup(){
  const payload = {
    registry: serializeRegistry(state.registry),
    people: {fin: state.finPool, clin: state.clinPool},
    personAliasOverrides: state.personAliasOverrides,
    settings: {range:state.range, weekdays:[...state.weekdays], holidays:[...state.holidays], ratioP:state.ratioP}
  };
  downloadBlob(JSON.stringify(payload,null,2), 'alkhitta-backup.json', 'application/json');
}
function approvePlan(){
  if(!state.plan || state.planApproved) return;
  state.preApproveSnapshot = serializeRegistry(state.registry);
  localStorage.setItem('alkhitta.registrySnapshot', JSON.stringify(state.preApproveSnapshot));
  for(const row of state.plan.rows){
    if(row.empty) continue;
    row.facility.lastVisit = row.date;
    row.facility.visitCount = (row.facility.visitCount||0)+1;
    if(!row.facility.visitHistory) row.facility.visitHistory = [];
    row.facility.visitHistory.push({date: row.date, team: [...row.finTeam, ...row.clinTeam].map(p=>p.name)});
    row.facility.visitHistory.sort((a,b)=>b.date-a.date);
    if(row.facility.visitHistory.length>20) row.facility.visitHistory.length = 20;
  }
  state.planApproved = true;
  saveRegistry();
  renderResults();
}
function undoApprove(){
  const raw = localStorage.getItem('alkhitta.registrySnapshot');
  if(!raw) return;
  state.registry = deserializeRegistry(JSON.parse(raw));
  state.planApproved = false;
  saveRegistry();
  renderResults();
}


function facilityStatus(f){
  if(f.manualExcluded) return 'excluded';
  if(f.pinned) return 'pinned';
  return 'included';
}
function setFacilityStatus(f, status){
  f.manualExcluded = status==='excluded';
  f.pinned = status==='pinned';
}
function daysSinceLabel(lastVisit){
  if(!lastVisit) return t('neverVisited');
  return t('daysAgo')(daysBetween(lastVisit, new Date()));
}
function filteredFacilities(){
  const q = norm(state.facilitySearch);
  return state.registry.filter(f=>{
    if(q && norm(f.name).indexOf(q)<0) return false;
    if(state.facilityKindFilter!=='all' && f.kind!==state.facilityKindFilter) return false;
    if(state.facilityCategoryFilter && f.category!==state.facilityCategoryFilter) return false;
    if(state.facilityLocationFilter && f.location!==state.facilityLocationFilter) return false;
    return true;
  });
}

function renderFacilityRow(f){
  const row = el('div', {class:'facility-row'});
  const topLine = el('div', {class:'facility-row-top'});
  const cb = el('input', {type:'checkbox', onchange:e=>{
    if(e.target.checked) state.facilitySelected.add(f.id); else state.facilitySelected.delete(f.id);
    renderFacilitiesView();
  }});
  cb.checked = state.facilitySelected.has(f.id);
  topLine.appendChild(cb);
  topLine.appendChild(el('span', {class:'sf-name'}, f.name));
  topLine.appendChild(el('span', {class:'sf-cat'}, f.category));
  topLine.appendChild(el('span', {class:'sf-kind'}, f.kind));
  topLine.appendChild(el('span', {class:'sf-loc'}, f.location||'—'));

  if(f.reviewFlag==='unknown-category') topLine.appendChild(el('span', {class:'review-flag'}, t('unknownCategoryFlagLabel')));
  row.appendChild(topLine);

  const midLine = el('div', {class:'facility-row-mid'});
  midLine.appendChild(el('span', null, `${t('lastVisitLabel')}: ${daysSinceLabel(f.lastVisit)}`));
  midLine.appendChild(el('span', null, `${t('visitCountLabel')}: ${f.visitCount||0}`));

  const weightInput = el('input', {type:'number', min:'0', max:'1.5', step:'0.05', value:String(f.weight), onchange:e=>{
    f.weight = Math.max(0, Math.min(1.5, +e.target.value||0)); saveRegistry();
  }});
  controlLine.appendChild(el('label', null, [t('weightLabel')+' ', weightInput]));
  const presetWrap = el('span', {class:'weight-presets'});
  for(const preset of [1, 0.5, 0.35]){
    presetWrap.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
      f.weight = preset; saveRegistry(); renderFacilitiesView();
    }}, String(preset)));
  }
  controlLine.appendChild(presetWrap);

  const statusWrap = el('span', {class:'segmented'});
  const curStatus = facilityStatus(f);
  const statusLabels = {included:t('statusIncluded'), excluded:t('statusExcluded'), pinned:t('statusPinned')};
  for(const s of ['included','excluded','pinned']){
    statusWrap.appendChild(el('button', {
      type:'button', 'aria-pressed': curStatus===s?'true':'false',
      onclick:()=>{ setFacilityStatus(f, s); saveRegistry(); renderFacilitiesView(); }
    }, statusLabels[s]));
  }
  controlLine.appendChild(statusWrap);

  const expandBtn = el('button', {type:'button', class:'chip', onclick:()=>{
    state.expandedFacilityId = state.expandedFacilityId===f.id ? null : f.id;
    renderFacilitiesView();
  }}, t('expandLabel'));
  controlLine.appendChild(expandBtn);
  row.appendChild(controlLine);

  if(state.expandedFacilityId===f.id){
    const detail = el('div', {class:'facility-row-detail'});

    const history = (f.visitHistory||[]).slice(0,5);
    if(!history.length) detail.appendChild(el('p', {class:'card-summary'}, t('noVisitsYet')));
    for(const v of history) detail.appendChild(el('p', null, `${fmtISO(v.date)} — ${v.team.join(' - ')}`));
    row.appendChild(detail);
  }
  return row;
}

function renderBulkBar(){
  const bar = el('div', {class:'bulk-bar'});
  const weightInput = el('input', {type:'number', min:'0', max:'1.5', step:'0.05', placeholder:'1'});
  bar.appendChild(el('label', null, [t('bulkWeightLabel')+' ', weightInput]));
  bar.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
    const w = Math.max(0, Math.min(1.5, +weightInput.value||0));
    for(const f of state.registry) if(state.facilitySelected.has(f.id)) f.weight = w;
    saveRegistry(); renderFacilitiesView();
  }}, t('applyWeight')));
  bar.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
    for(const f of state.registry) if(state.facilitySelected.has(f.id)) setFacilityStatus(f,'excluded');
    saveRegistry(); renderFacilitiesView();
  }}, t('bulkExclude')));
  bar.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
    for(const f of state.registry) if(state.facilitySelected.has(f.id)) setFacilityStatus(f,'pinned');
    saveRegistry(); renderFacilitiesView();
  }}, t('bulkPin')));
  bar.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
    for(const f of state.registry) if(state.facilitySelected.has(f.id)) setFacilityStatus(f,'included');
    saveRegistry(); renderFacilitiesView();
  }}, t('bulkInclude')));
