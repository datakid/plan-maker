async function handleRegistryFile(file){
  state.registryImportError = null;
  try{
    const name = file.name || '';
    let rows;
    if(/\.xlsx$/i.test(name)) rows = await parseXlsxArrayBuffer(await file.arrayBuffer());
    else if(/\.csv$/i.test(name)) rows = parseCSV(await file.text());
    else rows = parseTSV(await file.text());
    if(!rows.length){ state.registryImportError='—'; renderFacilitiesView(); return; }
    const {mapping, unmapped} = mapRegistryHeaders(rows[0]);
    if(unmapped.length){ state.registryImportError = t('remapTitle')+': '+unmapped.join(', '); renderFacilitiesView(); return; }
    const records = parseRegistryRows(rows.slice(1), mapping);
    const diff = computeRegistryDiff(records, state.registry);
    state.pendingRegistryImport = diff;
    state.missingFacilityActions = {};
    renderFacilitiesView();
  }catch(e){
    state.registryImportError = t('importErrorPrefix')+e.message;
    renderFacilitiesView();
  }
}
function renderRegistryImportSection(view){
  view.appendChild(el('h2', null, t('registryImportTitle')));
  if(state.pendingRegistryImport){
    const diff = state.pendingRegistryImport;
    view.appendChild(el('p', {class:'card-summary'}, t('dryRunSummary')(diff.added.length, diff.changed.length, diff.missing.length, diff.unparseable.length)));
    if(diff.added.length){
      view.appendChild(el('h3', null, t('addedLabel')));
      const list = el('ul', {class:'drop-list'});
      for(const a of diff.added) list.appendChild(el('li', null, `${a.name} (${a.category}, ${statusToArabic(a.status)})`));
      view.appendChild(list);
    }
    if(diff.changed.length){
      view.appendChild(el('h3', null, t('changedLabel')));
      const list = el('ul', {class:'drop-list'});
      for(const c of diff.changed){
        const fieldsText = c.fields.map(fl=>`${fl.field}: ${fl.from}→${fl.to}`).join(', ');
        list.appendChild(el('li', null, `${c.name} — ${fieldsText}`));
      }
      view.appendChild(list);
    }
    if(diff.missing.length){
      view.appendChild(el('h3', null, t('missingLabel')));
      const list = el('div', {class:'resolve-list'});
      for(const f of diff.missing){
        const row = el('div', {class:'resolve-row'});
        row.appendChild(el('span', null, f.name));
        const sel = el('select', {onchange:e=>{ state.missingFacilityActions[f.id]=e.target.value; }});
        sel.appendChild(el('option', {value:'keep'}, t('missingKeep')));
        sel.appendChild(el('option', {value:'exclude'}, t('missingExclude')));
        sel.value = state.missingFacilityActions[f.id]||'keep';
        row.appendChild(sel);
        list.appendChild(row);
      }
      view.appendChild(list);
    }
    const actions = el('div', {class:'export-actions'});
    actions.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
      localStorage.setItem('alkhitta.registryImportSnapshot', JSON.stringify(serializeRegistry(state.registry)));
      applyRegistryDiff(state.pendingRegistryImport, state.registry, state.missingFacilityActions);
      state.pendingRegistryImport = null;
      saveRegistry();
      renderFacilitiesView();
    }}, t('applyImport')));
    actions.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
      state.pendingRegistryImport = null; renderFacilitiesView();
    }}, t('cancelImport')));
    view.appendChild(actions);
    return;
  }

  const dz = el('div', {class:'dropzone'});
  const fileInput = el('input', {type:'file', accept:'.xlsx,.csv,.tsv,.txt', style:'display:none',
    onchange:e=>{ if(e.target.files[0]) handleRegistryFile(e.target.files[0]); }});
  dz.appendChild(fileInput);
  dz.appendChild(el('p', null, t('dropHere')));
  dz.addEventListener('click', ()=>fileInput.click());
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.style.background='var(--accent-soft)'; });
  dz.addEventListener('dragleave', ()=>{ dz.style.background=''; });
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.style.background='';
    if(e.dataTransfer.files[0]) handleRegistryFile(e.dataTransfer.files[0]);
  });
  view.appendChild(dz);
  if(state.registryImportError) view.appendChild(el('p', {class:'card-summary error-text'}, state.registryImportError));
  if(localStorage.getItem('alkhitta.registryImportSnapshot')){
    view.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
      const raw = localStorage.getItem('alkhitta.registryImportSnapshot');
      if(!raw) return;
      state.registry = deserializeRegistry(JSON.parse(raw));
      saveRegistry();
      renderFacilitiesView();
    }}, t('undoImport')));
  }
}

const MONTH_NAMES_AR = ['يناير','فبراير','مارس','ابريل','مايو','يونيو','يوليو','اغسطس','سبتمبر','اكتوبر','نوفمبر','ديسمبر'];
const MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAY_SHORT_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function resolveDateRange(){
  const today = new Date();
  const start0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if(state.range==='custom'){
    if(!state.customStart||!state.customEnd) return null;
    const s = parseDateFlexible(state.customStart);
    const e = parseDateFlexible(state.customEnd);
    if(!s||!e) return null;
    return {start:s, end:e};
  }
  const spanDays = state.range==='week' ? 6 : (state.range==='month' ? 29 : 89);
  return {start:start0, end:addDays(start0, spanDays)};
}
function computeWorkingDaysList(){
  const range = resolveDateRange();
  if(!range) return [];
  return workingDays(range.start, range.end, state.weekdays, state.holidays, new Set());
}
function monthLabel(date){
  const names = state.lang==='ar' ? MONTH_NAMES_AR : MONTH_NAMES_EN;
  return names[date.getMonth()]+' '+date.getFullYear();
}
function formatDateShort(date){
  const wd = state.lang==='ar' ? I18N.ar.weekdays[date.getDay()] : WEEKDAY_SHORT_EN[date.getDay()];
  return `${wd} ${date.getDate()}`;
}

function handleGenerate(){
  const range = resolveDateRange();
  if(!range) return;
  const result = state.importResult;
  const plan = generatePlan({
    registry: state.registry, finPool: state.finPool, clinPool: state.clinPool,
    startDate: range.start, endDate: range.end,
    weekdays: state.weekdays, holidays: state.holidays, exceptions: new Set(),
    mode: state.mode, ratioP: state.ratioP, countsM: state.countsM, countsR: state.countsR,
    finInitial: result ? result.initialFin : null,
    clinInitial: result ? result.initialClin : null,
    isOverTied: result ? makeOverTiedChecker(result.facilityPersonVisits, state.overTieMinVisits, state.overTieMinRatio) : null,
    isUnavailable: makeUnavailableChecker(),
    isBlocked: makeBlockedChecker(),
    applyGender: state.applyGenderPass,
    facilityPersonVisits: result ? result.facilityPersonVisits : null,
    globalDistanceBias: state.globalDistanceBias,
    familiarityGamma: state.familiarityGamma,
    hardBlockOverTied: state.hardBlockOverTied
  });
  state.plan = plan;
  state.planApproved = false;
  state.hiddenFacilityIds = new Set();
  state.hiddenPersonIds = new Set();
  state.exportFacilitySearch = '';
  state.exportPersonSearch = '';
  state.copyFeedback = null;
  localStorage.setItem('alkhitta.lastPlan', JSON.stringify({generatedAt: fmtISO(new Date()), N: plan.N, M: plan.budget.M, R: plan.budget.R}));
  renderResults();
}

function computeEligibleAlternatives(row, pool){
  const poolList = pool==='finTeam' ? state.finPool : state.clinPool;
  const currentIds = new Set(row[pool].map(p=>p.id));
  return poolList.filter(p=>{
    if(currentIds.has(p.id)) return false;
    if(p.active===false) return false;
    if((p.unavailable||[]).indexOf(fmtISO(row.date))>=0) return false;
    if((p.blockedFacilities||[]).indexOf(row.facility.id)>=0 || (p.blockedFacilities||[]).indexOf(row.facility.name)>=0) return false;
    return true;
  });
}
function renderResultRows(container, plan){
  const rows = plan.rows;
  let currentMonthKey=null, monthWrap=null;
  function ensureWrap(){
    if(!monthWrap){ monthWrap = el('div', {class:'month-section'}); container.appendChild(monthWrap); }
    return monthWrap;
  }
  rows.forEach((row, rowIndex)=>{
    if(row.empty){
      const dayRow = el('div', {class:'day-row empty'});
      dayRow.appendChild(el('span', {class:'facility'}, t('emptyDay')));
      ensureWrap().appendChild(dayRow);
      return;
    }
    const monthKey = row.date.getFullYear()+'-'+row.date.getMonth();
    if(monthKey!==currentMonthKey){
      currentMonthKey = monthKey;
      monthWrap = el('div', {class:'month-section'});
      monthWrap.appendChild(el('h3', null, monthLabel(row.date)));
      container.appendChild(monthWrap);
    }
    const dayRow = el('div', {class:'day-row '+row.kind});
    dayRow.appendChild(el('span', {class:'date'}, formatDateShort(row.date)));
    const whyOpen = state.expandedRowIndex===rowIndex;
    dayRow.appendChild(el('button', {
      type:'button', class:'facility facility-toggle',
      onclick:()=>{ state.expandedRowIndex = whyOpen?null:rowIndex; renderResults(); }
    }, row.facility.name));
    dayRow.appendChild(el('span', {class:'cat-chip'}, row.facility.category));
    const teamWrap = el('span', {class:'team-chips'});
    for(const pool of ['finTeam','clinTeam']){
      for(const p of row[pool]){
        const open = state.swapMenuOpenFor && state.swapMenuOpenFor.rowIndex===rowIndex && state.swapMenuOpenFor.pool===pool && state.swapMenuOpenFor.personId===p.id;
        teamWrap.appendChild(el('button', {
          type:'button', class:'mini-chip'+(open?' open':''),
          onclick:()=>{ state.swapMenuOpenFor = open ? null : {rowIndex, pool, personId:p.id}; renderResults(); }
        }, p.name));
        if(open){
          const menu = el('div', {class:'swap-menu'});
          const alts = computeEligibleAlternatives(row, pool);
          if(!alts.length) menu.appendChild(el('p', {class:'card-summary'}, t('noAlternatives')));
          for(const alt of alts){
            menu.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
              const idx = row[pool].indexOf(p);
              row[pool][idx] = alt;
              state.swapMenuOpenFor = null;
              renderResults();
            }}, alt.name));
          }
          teamWrap.appendChild(menu);
        }
      }
    }
    dayRow.appendChild(teamWrap);
    if(whyOpen){
      const f = row.facility;
      const daysText = f.lastVisit ? t('daysAgo')(daysBetween(f.lastVisit, plan.planStart)) : t('neverVisited');
      const streamText = row.kind==='basic' ? t('inStreamBasic') : t('inStreamContracted');
      dayRow.appendChild(el('div', {class:'why-detail'},
        `${daysText} · ${t('weightLabel')} ${f.weight} · ${t('rankLabel')} ${row.rankInStream} ${streamText}`));
    }
    monthWrap.appendChild(dayRow);
  });

function renderReview(container){
  container.appendChild(el('h2', null, t('reviewTitle')));
  const plan = state.plan;
  const retiredIds = new Set(RETIRED_SEED.map(p=>p.id));
  const gates = computeGates(plan, state.registry, retiredIds);
  const gateList = el('div', {class:'review-panel'});
  for(const g of gates) gateList.appendChild(el('div', {class:'gate '+(g.pass?'pass':'fail')}, t('gateLabels')[g.key]));
  container.appendChild(gateList);

  const nonEmpty = plan.rows.filter(r=>!r.empty);
  container.appendChild(el('p', {class:'card-summary'}, t('achievedMix')(plan.budget.M, plan.budget.R, nonEmpty.length)));
  if(plan.budget.notes.length) container.appendChild(el('p', {class:'card-summary'}, plan.budget.notes.join(' · ')));

  if(plan.pinnedOverflow && plan.pinnedOverflow.length){
    container.appendChild(el('p', {class:'card-summary error-text'}, t('pinnedOverflowWarning')(plan.pinnedOverflow.length)));
    const list = el('ul', {class:'drop-list'});
    for(const f of plan.pinnedOverflow) list.appendChild(el('li', null, f.name));
    container.appendChild(list);
  }

  const basicRows = nonEmpty.filter(r=>r.kind==='basic');
  const okCount = basicRows.length - plan.genderDropped.length;
  container.appendChild(el('p', {class:'card-summary'}, t('genderAchievedNote')(okCount, basicRows.length)));
  if(plan.genderDropped.length){
    container.appendChild(el('p', {class:'card-summary'}, t('genderDroppedNote')(plan.genderDropped.length)));
    const list = el('ul', {class:'drop-list'});
    for(const d of plan.genderDropped) list.appendChild(el('li', null, `${fmtISO(d.date)} — ${d.facility}`));
    container.appendChild(list);
  }

  container.appendChild(el('h3', null, t('thirdsTitle')));
  const thirds = computeThirds(nonEmpty);
  const thirdsTable = el('div', {class:'thirds-table'});
  thirds.forEach((th,i)=>{
    thirdsTable.appendChild(el('div', {class:'thirds-cell'}, `${t('thirdLabel')(i+1)}: ${th.basic} ${t('basicCount')} / ${th.contracted} ${t('contractedCount')}`));
  });
  container.appendChild(thirdsTable);

  const totals = computeTotals(plan.rows);
  const finSlots = nonEmpty.reduce((s,r)=>s+(r.kind==='basic'?2:1),0);
  const clinSlots = nonEmpty.length*2;
  const finDev = computeDeviation(state.finPool, totals.finCounts, finSlots);
  const clinDev = computeDeviation(state.clinPool, totals.clinCounts, clinSlots);
  container.appendChild(el('h3', null, t('deviationTitle')));
  const devWrap = el('div', {class:'deviation-list'});
  for(const d of [...finDev, ...clinDev]){
    const sign = d.deviation>0 ? '+' : '';
    devWrap.appendChild(el('p', null, `${d.person.name} — ${d.actual} (${sign}${d.deviation.toFixed(1)})`));
  }
  container.appendChild(devWrap);

  const nearMisses = computeNearMisses(plan, 10);
  if(nearMisses.length){
    container.appendChild(el('h3', null, t('nearMissTitle')));
    const list = el('ul', {class:'drop-list'});
    for(const f of nearMisses) list.appendChild(el('li', null, f.name));
    container.appendChild(list);
  }
}
function renderTotals(container){
  container.appendChild(el('h2', null, t('totalsTitle')));
  const totals = computeTotals(state.plan.rows);
  const clinWrap = el('div', {class:'totals-group'});
  clinWrap.appendChild(el('h3', null, t('clinPoolLabel')));
  for(const p of state.clinPool) clinWrap.appendChild(el('p', null, `${p.name} — ${totals.clinCounts[p.id]||0} ${t('perVisit')}`));
  const finWrap = el('div', {class:'totals-group'});
  finWrap.appendChild(el('h3', null, t('finPoolLabel')));
  for(const p of state.finPool) finWrap.appendChild(el('p', null, `${p.name} — ${totals.finCounts[p.id]||0} ${t('perVisit')}`));
  container.appendChild(clinWrap);
  container.appendChild(finWrap);
}
function renderResults(){
  const section = document.getElementById('results');
  const review = document.getElementById('review');
  const totalsEl = document.getElementById('totals');
  if(!state.plan){ section.hidden=true; review.hidden=true; totalsEl.hidden=true; return; }
  section.hidden=false; review.hidden=false; totalsEl.hidden=false;
  clear(section); clear(review); clear(totalsEl);
  section.appendChild(el('h2', null, t('resultsTitle')));
  const range = resolveDateRange();
  const printHeaderText = range
    ? `${t('appName')} — ${fmtISO(range.start)} → ${fmtISO(range.end)} — ${currentCycleNumber()}`
    : t('appName');
  section.appendChild(el('div', {class:'print-header'}, printHeaderText));
  renderResultRows(section, state.plan);

  const retiredIds = new Set(RETIRED_SEED.map(p=>p.id));
  const gates = computeGates(state.plan, state.registry, retiredIds);
  const blocked = gates.some(g=>!g.pass);
  const actions = el('div', {class:'export-actions'});
  const mk = (label, fn)=>{
    const attrs = {type:'button', class:'chip', onclick:fn};
    if(blocked) attrs.disabled='true';
    return el('button', attrs, label);
  };
  actions.appendChild(mk(t('exportXlsx'), exportXlsx));
  actions.appendChild(mk(t('exportCsv'), exportCsv));
  actions.appendChild(mk(t('copyTsv'), copyTsv));
  actions.appendChild(mk(t('exportBackup'), exportBackup));
  const approveAttrs = {type:'button', class:'chip', onclick:approvePlan};
  if(blocked || state.planApproved) approveAttrs.disabled='true';
  actions.appendChild(el('button', approveAttrs, t('approvePlan')));
  if(state.planApproved && localStorage.getItem('alkhitta.registrySnapshot')){
    actions.appendChild(el('button', {type:'button', class:'chip', onclick:undoApprove}, t('undoApprove')));
  }
  if(state.copyFeedback) actions.appendChild(el('span', {class:'copy-feedback'}, state.copyFeedback));
  section.appendChild(actions);
  if(state.planApproved) section.appendChild(el('p', {class:'card-summary'}, t('approvedNote')));

  section.appendChild(renderVisibilityPanel());

  renderReview(review);
  renderTotals(totalsEl);
}

function applyTheme(){
  const root = document.documentElement;
  if(state.theme==='system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', state.theme);
}
function cycleTheme(){
  state.theme = state.theme==='system' ? 'light' : (state.theme==='light' ? 'dark' : 'system');
  localStorage.setItem('alkhitta.theme', state.theme);
  applyTheme();
}
function toggleLang(){
  state.lang = state.lang==='ar' ? 'en' : 'ar';
  localStorage.setItem('alkhitta.lang', state.lang);
  render();
}

function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr';
  applyTheme();
  document.getElementById('wordmarkText').textContent = t('appName');
  document.getElementById('footerText').textContent = t('footer');
  document.getElementById('generateBtn').textContent = t('generate');
  renderStep1();
  renderStep2();
  renderStep3();
  renderResults();
}

async function showSelfTestView(){
  document.querySelector('.shell').hidden = true;
  document.querySelector('.topbar').hidden = true;
  document.getElementById('settingsView').hidden = true;
  document.getElementById('facilitiesView').hidden = true;
  const view = document.getElementById('selftestView');
  view.hidden = false;
  clear(view);
  renderSubViewBar(view, 'selftestTitle');
  view.appendChild(el('p', {class:'card-summary'}, '...'));
  const results = await runSelfTests();
  clear(view);
  renderSubViewBar(view, 'selftestTitle');
  const list = el('div', {class:'review-panel'});
  for(const r of results){
    const cls = r.status==='pass' ? 'pass' : (r.status==='fail' ? 'fail' : 'pending');
    const row = el('div', {class:'gate '+cls});
    row.appendChild(el('strong', null, r.name));
    row.appendChild(el('span', null, ' — '+r.detail));
    list.appendChild(row);
  }
  view.appendChild(list);
  const passCount = results.filter(r=>r.status==='pass').length;
  const failCount = results.filter(r=>r.status==='fail').length;
  const pendingCount = results.filter(r=>r.status==='pending').length;
  view.appendChild(el('p', {class:'card-summary'}, `${passCount} / ${results.length} passed · ${failCount} failed · ${pendingCount} pending`));
}

function renderSettingsView(){
  document.querySelector('.shell').hidden = true;
  document.querySelector('.topbar').hidden = true;
  document.getElementById('selftestView').hidden = true;
  document.getElementById('facilitiesView').hidden = true;
  const view = document.getElementById('settingsView');
  view.hidden = false;
  clear(view);
  renderSubViewBar(view, 'settingsTitle');

  const tabs = [['people','settingsTabPeople'],['formula','settingsTabFormula'],['aliases','settingsTabAliases'],['data','settingsTabData']];
  const seg = el('div', {class:'segmented', role:'group'});
  for(const pair of tabs){
    seg.appendChild(el('button', {
      type:'button', 'aria-pressed': state.settingsTab===pair[0] ? 'true':'false',
      onclick:()=>{ state.settingsTab=pair[0]; renderSettingsView(); }
    }, t(pair[1])));
  }
  view.appendChild(seg);

  if(state.settingsTab==='formula'){
    view.appendChild(el('h2', null, t('overTieTitle')));
    view.appendChild(el('label', null, [t('minVisitsLabel')+' ', el('input', {type:'number', min:'1', value:String(state.overTieMinVisits), onchange:e=>{
      state.overTieMinVisits = Math.max(1, Math.round(+e.target.value||3)); saveSettings();
    }})]));
    view.appendChild(el('label', null, [t('minRatioLabel')+' ', el('input', {type:'number', min:'0', max:'100', value:String(Math.round(state.overTieMinRatio*100)), onchange:e=>{
      state.overTieMinRatio = Math.max(0, Math.min(100, +e.target.value||60))/100; saveSettings();
    }})]));
    const hardBlockToggle = el('input', {type:'checkbox', onchange:e=>{ state.hardBlockOverTied=e.target.checked; saveSettings(); }});
    hardBlockToggle.checked = state.hardBlockOverTied;
    view.appendChild(el('label', {class:'inline-check'}, [hardBlockToggle, ' '+t('hardBlockLabel')]));

    view.appendChild(el('h2', null, t('passesTitle')));
    const genderToggle = el('input', {type:'checkbox', onchange:e=>{ state.applyGenderPass=e.target.checked; saveSettings(); }});
    genderToggle.checked = state.applyGenderPass;
    view.appendChild(el('label', {class:'inline-check'}, [genderToggle, ' '+t('genderPassLabel')]));

    view.appendChild(el('label', null, [t('distanceBiasLabel')+' ', el('input', {type:'range', min:'-1', max:'1', step:'0.1', value:String(state.globalDistanceBias), onchange:e=>{
      state.globalDistanceBias = Math.max(-1, Math.min(1, +e.target.value||0)); saveSettings();
    }})]));
    view.appendChild(el('label', null, [t('familiarityGammaLabel')+' ', el('input', {type:'number', min:'0', max:'2', step:'0.05', value:String(state.familiarityGamma), onchange:e=>{
      state.familiarityGamma = Math.max(0, +e.target.value==0?0:(+e.target.value||0.35)); saveSettings();
    }}), el('span', {class:'field-hint'}, t('familiarityGammaHint'))]));
    return;
  }

  if(state.settingsTab==='aliases'){
    view.appendChild(el('h2', null, t('aliasTitle')));
    const facAliasArea = el('textarea', {rows:'4'});
    facAliasArea.value = Object.entries(FACILITY_ALIASES).map(e=>e[0]+'='+e[1]).join('\n');
    const personAliasArea = el('textarea', {rows:'4'});
    personAliasArea.value = Object.entries(PERSON_ALIASES).map(e=>e[0]+'='+e[1]).join('\n');
    view.appendChild(el('label', null, [t('facilityAliasLabel'), facAliasArea]));
    view.appendChild(el('label', null, [t('personAliasLabel'), personAliasArea]));
    view.appendChild(el('button', {type:'button', class:'chip', onclick:()=>{
      const parseLines = txt=>{
        const obj={};
        txt.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
          const idx = l.indexOf('=');
          if(idx>0) obj[l.slice(0,idx).trim()] = l.slice(idx+1).trim();
        });
        return obj;
      };
      FACILITY_ALIASES = Object.assign({}, DEFAULT_FACILITY_ALIASES, parseLines(facAliasArea.value));
      PERSON_ALIASES = Object.assign({}, DEFAULT_PERSON_ALIASES, parseLines(personAliasArea.value));
      saveAliasOverrides();
    }}, t('saveAliases')));
    return;
  }

  if(state.settingsTab==='data'){
    view.appendChild(el('a', {href:'#facilities', class:'chip'}, t('facilitiesTitle')));
    view.appendChild(el('a', {href:'#selftest', class:'chip'}, t('selftestTitle')));
    return;
  }

  view.appendChild(el('h3', null, t('finPoolLabel')));
  view.appendChild(buildPeopleTable(state.finPool, renderSettingsView));
  view.appendChild(el('h3', null, t('clinPoolLabel')));
  view.appendChild(buildPeopleTable(state.clinPool, renderSettingsView));
}

function init(){
  loadSettings();
  loadAliasOverrides();
  state.registry = loadRegistry();
  state.personAliasOverrides = loadPersonAliases();
  const people = loadPeople();
  state.finPool = people.fin;
  state.clinPool = people.clin;
  document.getElementById('generateBtn').addEventListener('click', handleGenerate);
  document.getElementById('themeToggleBtn').addEventListener('click', cycleTheme);
  document.getElementById('langToggleBtn').addEventListener('click', toggleLang);
  document.getElementById('settingsBtn').addEventListener('click', ()=>{ location.hash='#settings'; });
  document.getElementById('facilitiesBtn').addEventListener('click', ()=>{ location.hash='#facilities'; });
  function routeFromHash(){
    if(location.hash==='#selftest'){ showSelfTestView(); }
    else if(location.hash==='#settings'){ renderSettingsView(); }
    else if(location.hash==='#facilities'){ renderFacilitiesView(); }
    else {
      document.getElementById('selftestView').hidden = true;
      document.getElementById('settingsView').hidden = true;
      document.getElementById('facilitiesView').hidden = true;
      document.querySelector('.shell').hidden = false;
      document.querySelector('.topbar').hidden = false;
      render();
    }
  }
  routeFromHash();
  window.addEventListener('hashchange', routeFromHash);
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
