<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/app.css"></head><body>
<header class="topbar" id="topbar"></header><main class="page stack" id="page"></main><div id="printSurface"></div>
<script src="js/core.js"></script><script src="js/seed.js"></script><script src="js/store.js"></script><script src="js/i18n.js"></script><script src="js/engine.js"></script><script src="js/goals.js"></script><script src="js/planner.js"></script><script src="js/ui.js"></script><script src="js/io.js"></script><script src="js/views/plan.js"></script><script src="js/views/facilities.js"></script><script src="js/views/team.js"></script><script src="js/views/goals.js"></script><script src="js/views/rules.js"></script><script src="js/views/data.js"></script><script src="js/app.js"></script>
<script>
localStorage.clear();
window.addEventListener('error', e=>console.log('WINERR', e.message, e.filename, e.lineno));
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    try{
      const s = S();
      console.log('workdays', JSON.stringify(s.calendar.workdays), 'share', s.volume.share, 'goals', s.goals.length);
      console.log('cats', App.data.categories.filter(c=>c.kind!=='excluded').map(c=>c.name+':'+schedulableFacilities().filter(f=>f.category===c.name).length).join(' '));
      const pv = volumePreview();
      console.log('preview', pv.basic, pv.contracted, pv.workdays);
      const w = planWindow();
      const d1 = isoOf(w.work[2]);
      const fac = schedulableFacilities().find(f=>facilityKind(f)==='contracted');
      const ppl = activePeople().slice(0,2).map(p=>p.id);
      s.overrides.push(newOverride({date:d1, facilityId:fac.id, people:ppl, fill:false}));
      const fri = (()=>{ for(let o=w.start;o<=w.end;o++) if(wdOf(o)===5) return isoOf(o); })();
      const fac2 = schedulableFacilities().find(f=>facilityKind(f)==='basic');
      s.overrides.push(newOverride({date:fri, facilityId:fac2.id, people:[], fill:true}));
      s.goals.push(Object.assign(newGoal('atLeast'), {n:3, strict:'must', scope:{kind:'category', ids:['اشعة']}}));
      s.goals.push(Object.assign(newGoal('atMost'), {n:1, strict:'must', scope:{kind:'category', ids:['معمل']}}));
      s.goals[1].on = true;
      const r = generatePlan();
      if(r.error){ console.log('ERR', r.error); return; }
      const p = r.plan;
      console.log('visits', p.visits.length, 'days', p.days.length, 'requested', p.requested);
      const fx = p.visits.filter(v=>v.fixed);
      console.log('fixed', fx.map(v=>v.date+' '+(facilityById(v.facilityId)||{}).name+' team='+visitTeamIds(v).length).join(' | '));
      const ov1 = p.visits.find(v=>v.overrideId===s.overrides[0].id);
      console.log('ov1 team exact', JSON.stringify(visitTeamIds(ov1))===JSON.stringify(ppl));
      const busy = p.visits.filter(v=>v.date===d1 && !v.fixed).some(v=>visitTeamIds(v).some(id=>ppl.includes(id)));
      console.log('fixed people double-booked', busy);
      console.log('friday included', p.days.includes(fri), 'other visits on friday', p.visits.filter(v=>v.date===fri && !v.fixed).length);
      const ph = p.visits.filter(v=>(facilityById(v.facilityId)||{}).category==='اشعة').length;
      const lab = p.visits.filter(v=>(facilityById(v.facilityId)||{}).category==='معمل').length;
      console.log('pharmacy', ph, 'lab', lab);
      const A = analyzePlan(p);
      console.log('checks', A.checks.map(c=>c.key+':'+(c.ok?'ok':c.n)).join(' '));
      console.log('goals', A.goals.map(g=>g.title+' '+g.state+' '+g.label).join(' | '));
      console.log('diags', A.diags.slice(0,8).map(d=>d.key).join(','));
      App.plan = p; savePlan(); emit('plan');
      approvePlan(); console.log('approved', App.plan.approved); unapprovePlan(); console.log('unapproved', !App.plan.approved);
      App.ui.view = (location.hash==='#cal' ? 'calendar' : null) || window.TEST_VIEW || 'summary'; renderResults();
      if(window.TEST_SHEET==='ov') openOverride(s.overrides[0].id);
      if(window.TEST_SHEET==='goals') openGoals();
      console.log('scrollW', document.documentElement.scrollWidth, 'clientW', document.documentElement.clientWidth);
    }catch(e){ console.log('EXC', e.message, e.stack); }
  }, 300);
});
</script></body></html>
